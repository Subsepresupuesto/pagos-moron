<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Programación de Pagos · Morón</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
@font-face{font-family:"Neo Sans Moron";src:url("neo-sans-pro-medium.woff2") format("woff2");font-weight:400 800;font-style:normal;font-display:swap}
/* Layout: home banking. Barra lateral azul noche con navegación; contenido en tarjetas blancas sobre gris frío.
   Inicio con tarjeta de saldo y lista de movimientos; el detalle se abre en un panel lateral. En el teléfono, la navegación pasa abajo. */
:root{
  --side:#0A1A3A; --side2:#132A57; --side-fg:#EAF0FC; --side-mute:#8D9DC0; --side-line:#1D3363;
  --bg:#F1F4F9; --card:#FFFFFF; --card2:#F6F8FC; --line:#E2E7F0; --line2:#CCD4E2;
  --ink:#0D1630; --ink2:#46526E; --mute:#8590A9;
  --brand:#F01C24; --brand2:#C8121A; --brandbg:#FDECEC;
  --ok:#0E8A4E; --okbg:#E5F5EC; --warn:#B46A00; --warnbg:#FFF3DD; --bad:#CF3434; --badbg:#FDEBEB;
  --hero1:#0C2253; --hero2:#1A47A8;
  --s1:#F01C24; --s2:#0A1A3A; --s3:#2F62D9; --s4:#F0A23A; --s5:#8FB0F0; --s6:#A3AEC4; --s7:#16A3A0;
  --shadow:0 1px 2px rgba(13,22,48,.05),0 6px 20px rgba(13,22,48,.06);
  --r:16px; --rs:10px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Neo Sans Moron","Inter",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --side:#060E22; --side2:#0F1F45; --side-fg:#E6ECF8; --side-mute:#7E8DB0; --side-line:#16264D;
  --bg:#0A1120; --card:#111A2D; --card2:#16213A; --line:#1F2C48; --line2:#2C3B5D;
  --ink:#E9EEF8; --ink2:#AAB6CF; --mute:#7886A5;
  --brand:#FF4D55; --brand2:#FF7178; --brandbg:rgba(255,77,85,.14);
  --ok:#3CC583; --okbg:rgba(60,197,131,.13); --warn:#F0B04A; --warnbg:rgba(240,176,74,.13); --bad:#F06B6B; --badbg:rgba(240,107,107,.13);
  --hero1:#102A66; --hero2:#2050C0;
  --s1:#FF4D55; --s2:#C9D6F2; --s3:#5B8CFF; --s4:#F0B04A; --s5:#2F55B8; --s6:#56637F; --s7:#2EC4C0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#060E22; --side2:#0F1F45; --side-fg:#E6ECF8; --side-mute:#7E8DB0; --side-line:#16264D;
  --bg:#0A1120; --card:#111A2D; --card2:#16213A; --line:#1F2C48; --line2:#2C3B5D;
  --ink:#E9EEF8; --ink2:#AAB6CF; --mute:#7886A5;
  --brand:#FF4D55; --brand2:#FF7178; --brandbg:rgba(255,77,85,.14);
  --ok:#3CC583; --okbg:rgba(60,197,131,.13); --warn:#F0B04A; --warnbg:rgba(240,176,74,.13); --bad:#F06B6B; --badbg:rgba(240,107,107,.13);
  --hero1:#102A66; --hero2:#2050C0;
  --s1:#FF4D55; --s2:#C9D6F2; --s3:#5B8CFF; --s4:#F0B04A; --s5:#2F55B8; --s6:#56637F; --s7:#2EC4C0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
#root{min-height:100vh;min-height:100dvh}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em;text-wrap:balance}
h1,h2,.disp,.hero .big,.stat .v,.ticket .big,.drawer .dh .big,.logo b,.login-card h2{font-family:var(--display);font-weight:500;letter-spacing:-.01em}
[hidden]{display:none!important}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- acceso ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);padding-top:env(safe-area-inset-top,0px)}
.login-art{background:radial-gradient(120% 90% at 0% 100%,var(--hero2) 0%,transparent 60%),linear-gradient(160deg,var(--side) 0%,var(--hero1) 100%);color:var(--side-fg);padding:48px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 60px rgba(255,255,255,.025),0 0 0 140px rgba(255,255,255,.02)}
.logo{display:flex;align-items:center;gap:12px}
.logo .lg{width:38px;height:38px;border-radius:11px;background:var(--brand);font-family:var(--display);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
.logo b{display:block;font-size:15px;font-weight:700}
.logo span{font-size:12.5px;color:var(--side-mute)}
.login-art h1{font-size:clamp(30px,4vw,46px);font-weight:800;line-height:1.05;max-width:13ch}
.login-art p{color:var(--side-mute);max-width:44ch;font-size:15.5px;margin:14px 0 0}
.steps{display:flex;gap:10px;flex-wrap:wrap}
.steps span{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--side-fg)}
.login-form{display:grid;place-items:center;padding:32px max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px));background:var(--bg)}
.login-card{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.login-card h2{font-size:26px;font-weight:800}
.login-card p{margin:0;color:var(--ink2);font-size:14px}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:22px;padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{padding:0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--side-mute);text-decoration:none;font-weight:600;font-size:14px}
.nav a:hover{color:var(--side-fg);background:rgba(255,255,255,.05)}
.nav a[aria-current="page"]{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.nav a[aria-current="page"] svg{color:var(--brand2)}
.nav .badge{margin-left:auto;background:var(--brand);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.nav-sep{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--side-mute);opacity:.7;padding:10px 12px 4px}
.me{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--side-line)}
.me .row1{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--brandbg);color:var(--brand)}
.side .av{background:var(--brand);color:#fff}
.me b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;font-size:12px;color:var(--side-mute)}
.me select{width:100%;background:var(--side2);border:1px solid var(--side-line);color:var(--side-fg);border-radius:9px;padding:6px 8px;font-size:12.5px}
.me .acts{display:flex;gap:6px}
.me .acts button{flex:1;background:transparent;border:1px solid var(--side-line);color:var(--side-fg);border-radius:9px;padding:6px;font-size:12.5px;font-weight:600;cursor:pointer}
.me .acts button:hover{background:rgba(255,255,255,.06)}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:20px max(28px,env(safe-area-inset-right,0px)) 6px 28px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.topbar h1{font-size:24px;font-weight:800}
.topbar .sub{font-size:13px;color:var(--mute)}
.topbar .sp{flex:1}
.icbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2);position:relative}
.icbtn:hover{color:var(--ink);border-color:var(--line2)}
.icbtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.mobile-only{display:none}
main{padding:14px max(28px,env(safe-area-inset-right,0px)) 48px 28px;display:flex;flex-direction:column;gap:18px;max-width:1380px;width:100%}
.bnav{display:none}

/* ---------- piezas ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card.flat{box-shadow:none}
.card h3{font-size:16px;font-weight:700}
.cap{font-size:13px;color:var(--mute);margin:2px 0 0}
.sect{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.sect h2{font-size:17px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.row{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.lead{color:var(--ink2);margin:4px 0 0;max-width:74ch}

.hero{border-radius:22px;color:#fff;padding:24px 26px;position:relative;overflow:hidden;background:radial-gradient(90% 120% at 100% 0%,var(--hero2) 0%,transparent 65%),linear-gradient(135deg,var(--hero1),var(--side));box-shadow:0 10px 30px rgba(12,34,83,.25);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.hero::after{content:"";position:absolute;right:-80px;bottom:-140px;width:320px;height:320px;border-radius:50%;border:1px solid rgba(255,255,255,.09);box-shadow:0 0 0 46px rgba(255,255,255,.03)}
.hero .lbl{font-size:13px;color:rgba(255,255,255,.72);font-weight:600}
.hero .big{font-size:clamp(30px,4.2vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 10px}
.hero .big small{font-size:.5em;font-weight:700;opacity:.75;margin-right:4px;vertical-align:.35em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.12);padding:5px 11px;border-radius:999px}
.wk{display:flex;gap:10px;align-items:flex-end;height:96px;position:relative;z-index:1}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.7);font-weight:600}
.wk i{display:block;width:26px;border-radius:7px 7px 3px 3px;background:rgba(255,255,255,.22);min-height:4px}
.wk .on i{background:var(--brand)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12.5px;color:var(--mute);font-weight:600}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat .s{font-size:12.5px;color:var(--ink2)}

.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.search input[type=search]{border:0;background:transparent;padding:13px 0;flex:1;min-width:0;outline:none;font-size:15px;box-shadow:none;border-radius:0}
.search svg{color:var(--mute)}

.mov{display:flex;flex-direction:column}
.mov .mh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:14px 4px 6px}
.mi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 12px;border-radius:14px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.mi:hover{background:var(--card2)}
.mi + .mi{border-top:1px solid var(--line);border-radius:0}
.mi:hover + .mi{border-top-color:transparent}
.mi .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--brandbg);color:var(--brand)}
.mi .t{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .d{font-size:12.5px;color:var(--mute)}
.mi .r{text-align:right}
.mi .r .amt{font-weight:800;font-size:15.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--brandbg);color:var(--brand)}.pill.mute{background:var(--card2);color:var(--mute)}
.pill.plain::before{display:none}

/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:11px;padding:9px 15px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2);border-color:var(--brand2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font-weight:600;font-size:inherit}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:600;min-width:0}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],select,textarea{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:14px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brandbg)}
textarea{width:100%;min-height:70px;resize:vertical}
input.money{text-align:right;width:150px;font-variant-numeric:tabular-nums}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--ink2);cursor:pointer;font-weight:500}
.chk input{accent-color:var(--brand);width:16px;height:16px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{background:transparent;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.filters input[type=search]{width:260px}

/* tablas */
.tw{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:12px}
.tw.tall{max-height:620px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th{font-weight:700;text-align:left;color:var(--mute);background:var(--card2);border-bottom:1px solid var(--line);padding:10px 12px;white-space:nowrap;font-size:12px;position:sticky;top:0;z-index:1}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:top;background:var(--card)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--card2)}
tr.sel td{background:var(--brandbg)!important}
tr.added td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
tr.dim td{color:var(--mute)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
td.nw{white-space:nowrap}
td .sub{display:block;font-size:12px;color:var(--mute)}
td.prov{min-width:220px;max-width:340px}
td.prov b{font-weight:700}
td .clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
#wtab td.prov{min-width:180px;max-width:230px}
#wtab input.money{width:122px;padding:7px 8px;font-size:13px}
#wtab td,#wtab th{padding-left:10px;padding-right:10px}
td .pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
tfoot td{font-weight:800;background:var(--card2)!important;border-top:1px solid var(--line2);border-bottom:0;position:sticky;bottom:0}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.borrador{background:var(--card2);color:var(--ink2)}.st.enviada{background:var(--warnbg);color:var(--warn)}.st.aprobada{background:var(--okbg);color:var(--ok)}.st.rechazada{background:var(--badbg);color:var(--bad)}.st.descartada{background:var(--card2);color:var(--mute)}
.empty{padding:34px 20px;text-align:center;color:var(--ink2);border:1.5px dashed var(--line2);border-radius:var(--r);background:var(--card)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
.note{font-size:13.5px;padding:11px 14px;border-radius:12px;background:var(--brandbg);color:var(--ink)}
.note.bad{background:var(--badbg)}.note.warn{background:var(--warnbg)}.note.ok{background:var(--okbg)}
.bar{height:6px;background:var(--card2);border-radius:99px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}

/* avisos */
.avisos{display:flex;flex-direction:column;gap:8px}
.aviso{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;box-shadow:var(--shadow)}
.aviso .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.aviso.warn .ic{background:var(--warnbg);color:var(--warn)}.aviso.bad .ic{background:var(--badbg);color:var(--bad)}.aviso.info .ic{background:var(--brandbg);color:var(--brand)}
.aviso b.k{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.aviso.warn b.k{color:var(--warn)}.aviso.bad b.k{color:var(--bad)}

/* editor */
.wb{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px;align-items:start}
.side-sum{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
.ticket{border-radius:20px;color:#fff;padding:20px;background:linear-gradient(150deg,var(--hero1),var(--side));box-shadow:0 10px 26px rgba(12,34,83,.22)}
.ticket .lbl{font-size:12.5px;color:rgba(255,255,255,.7);font-weight:600}
.ticket .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:2px 0 12px}
.ticket .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid rgba(255,255,255,.1)}
.ticket .ln span:first-child{color:rgba(255,255,255,.72)}
.ticket label.f{color:rgba(255,255,255,.75)}
.ticket input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.ticket input:disabled{opacity:.8}

<body>
<div id="root"></div>
<div id="modal" class="modal" hidden></div>
<div id="drawer" class="drawer-bg" hidden></div>
<div id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* ============ Configuración ============ */
const CFG = {
  url: 'https://mkbtajgrxynqwrsebvhd.supabase.co',
  key: 'sb_publishable_20WkAUCXyxZnaVZAGRp6ig_bmcOxe9t',
  xlsxLib: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
};
const sb = (window.__mockSupabase || window.supabase).createClient(CFG.url, CFG.key);

/* ============ Íconos ============ */
const IC = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',
  list:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  cheque:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 14h5M15 11h3M2.5 10h19"/>',
  db:'<ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13"/><path d="M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .6 3.2 2.5 3.5 5.5"/>',
  out:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 21v-5h-5"/>',
  send:'<path d="M7 17 17 7M9 7h8v8"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  warn:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>',
  users2:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h6M7 13h10M7 17h4"/><circle cx="17" cy="9" r="1.5"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>'
};
const icon = (n, s='') => `<svg class="i" viewBox="0 0 24 24" ${s} aria-hidden="true">${IC[n]}</svg>`;

/* ============ Utilidades ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf2 = new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1});
const money = v => '$ ' + nf2.format(+v||0);
const moneyH = v => { const [e,d]=nf2.format(+v||0).split(','); return `<small>$</small>${e}<small style="font-size:.55em;vertical-align:.3em;margin-left:1px">,${d}</small>`; };
const mm = v => { v=+v||0; return Math.abs(v)>=1e9 ? '$ '+nf2.format(v/1e9)+' mil M' : '$ '+nf1.format(v/1e6)+' M'; };
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const pd = iso => { if(!iso) return null; const [y,m,d]=String(iso).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); };
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd = s => { const d=pd(s); return d? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear() : '—'; };
const fdl = s => { const d=pd(s); return d? `${DIA[d.getDay()]} ${d.getDate()} de ${MES[d.getMonth()]}` : '—'; };
const fdt = s => { if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); };
const today = () => iso(new Date());
const wom = s => { const d=pd(s).getDate(); return d<=7?1:d<=14?2:d<=21?3:4; };
const womRange = (y,m,w) => { const last=new Date(y,m+1,0).getDate(); const a=[1,8,15,22][w-1]; const b=w===4?last:a+6; return [new Date(y,m,a), new Date(y,m,b)]; };
const monthKey = s => String(s).slice(0,7);
const monthName = k => { const [y,m]=k.split('-').map(Number); return MES[m-1]+' '+y; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const sum = (a,f=x=>x) => a.reduce((s,x)=>s+(+f(x)||0),0);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const initials = s => String(s||'').replace(/\b(S\.?A\.?|S\.?R\.?L\.?|SRL|SA|SAS|SACI|S\.A\.C\.I\.)\b/gi,'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '·';
const ROLES = { lector:'Lector', director:'Director de Pagos', subprog:'Subsecretario de Programación Financiera', subplan:'Subsecretario de Planificación Presupuestaria', admin:'Administración' };
const ROLE_SHORT = { lector:'Lector', director:'Director de Pagos', subprog:'Subs. Programación Financiera', subplan:'Subs. Planificación Presupuestaria', admin:'Administración' };
const ESTADOS = { borrador:'Borrador', enviada:'En revisión', aprobada:'Aprobada', rechazada:'Rechazada', descartada:'Descartada' };

function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, err?7000:3500); }
function fail(e){ console.error(e); toast((e && (e.message||e.error_description)) || 'Ocurrió un error. Probá de nuevo.', true); }
async function q(p){ const {data,error}=await p; if(error) throw error; return data; }
async function all(build){ const out=[]; for(let from=0;;from+=1000){ const rows=await q(build().range(from,from+999)); out.push(...rows); if(rows.length<1000) break; } return out; }
function download(name, blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500); }
function csv(rows){ return '﻿'+rows.map(r=>r.map(v=>{ if(typeof v==='number') return String(v).replace('.',','); const s=String(v??''); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\r\n'); }
let _xlsx; function loadXlsx(){ if(window.XLSX) return Promise.resolve(window.XLSX); return _xlsx ||= new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=CFG.xlsxLib; s.onload=()=>res(window.XLSX); s.onerror=()=>rej(new Error('No se pudo cargar el lector de Excel')); document.head.appendChild(s); }); }
function parseAmt(s){ s=String(s).trim().replace(/\$|\s/g,''); if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); return parseFloat(s); }

/* ============ Estado ============ */
const S = { session:null, perfil:null, viewAs:null, carga:null, fact:[], factByKey:new Map(), progs:[], items:[], itemsByProg:new Map(),
  cheques:[], esquemas:[], alertas:[], perfiles:[], feed:[], feedItems:new Map(), tab:'inicio' };
function realRole(){ return S.perfil?.rol || 'lector'; }
function role(){ return realRole()==='admin' ? (S.viewAs||'admin') : realRole(); }
function is(...r){ const x=role(); return x==='admin' || r.includes(x); }
const internal = () => is('director','subprog','subplan');

const TABS = [
  {id:'inicio', t:'Inicio', i:'home', ok:()=>true},
  {id:'presel', t:'Preselección', i:'list', ok:()=>is('director','subplan'), g:'Circuito'},
  {id:'revision', t:'Aprobación', i:'shield', ok:()=>is('subprog','subplan'), g:'Circuito'},
  {id:'cheques', t:'Cheques diferidos', i:'cheque', ok:()=>internal(), g:'Circuito'},
  {id:'base', t:'Base de facturas', i:'db', ok:()=>internal(), g:'Información'},
  {id:'proveedores', t:'Proveedores', i:'users2', ok:()=>internal(), g:'Información'},
  {id:'analisis', t:'Análisis y flujo', i:'chart', ok:()=>is('subprog','subplan'), g:'Información'},
  {id:'alertas', t:'Alertas', i:'bell', ok:()=>is('director','subprog','subplan'), g:'Información'},
  {id:'usuarios', t:'Usuarios', i:'users', ok:()=>is('subprog','subplan'), g:'Administración'}
];
const TITLES = {inicio:'Pagos aprobados', presel:'Preselección de facturas', revision:'Aprobación', cheques:'Cheques diferidos', base:'Base de facturas', analisis:'Análisis y flujo de caja', alertas:'Alertas', usuarios:'Usuarios', proveedores:'Proveedores'};

/* ============ Datos ============ */
async function loadFeed(){ S.feed = await q(sb.from('v_feed_pagos').select('*').order('fecha_pago',{ascending:false})); }
async function loadFeedItems(id){
  if(S.feedItems.has(id)) return S.feedItems.get(id);
  const it = await all(()=>sb.from('programacion_items').select('clave,cprov,proveedor,dependencia,ff,oc,expediente,comprobante,f_factura,importe,monto,nota').eq('programacion_id',id).eq('vigente',true).order('proveedor'));
  S.feedItems.set(id,it); return it;
}
async function loadInternal(){
  if(!internal()) return;
  const [cargas, fact, progs, items, cheques, esquemas, alertas] = await Promise.all([
    q(sb.from('base_cargas').select('*').eq('activa',true)),
    all(()=>sb.from('v_facturas_pendientes').select('*').order('proveedor').order('comprobante')),
    q(sb.from('programaciones').select('*').neq('estado','descartada').order('fecha_pago',{ascending:false})),
    all(()=>sb.from('programacion_items').select('*').eq('vigente',true).order('id')),
    all(()=>sb.from('cheques').select('*').order('f_vencimiento')),
    q(sb.from('cheque_esquemas').select('*').order('id',{ascending:false})),
    q(sb.from('alertas').select('*').order('id',{ascending:false}))
  ]);
  S.carga = cargas[0] || null;
  S.fact = fact.map(r=>({...r, saldo:+r.saldo, importe:+r.importe, pagado:+r.pagado, pendiente:+r.pendiente, en_curso:+r.en_curso, pagado_portal:+r.pagado_portal}));
  S.factByKey = new Map(S.fact.map(r=>[r.clave,r]));
  S.progs = progs; S.items = items.map(i=>({...i, monto:+i.monto, importe:+i.importe}));
  S.itemsByProg = new Map(); for(const i of S.items){ if(!S.itemsByProg.has(i.programacion_id)) S.itemsByProg.set(i.programacion_id,[]); S.itemsByProg.get(i.programacion_id).push(i); }
  S.cheques = cheques.map(c=>({...c, monto:+c.monto})); S.esquemas = esquemas; S.alertas = alertas.map(a=>({...a, monto:a.monto==null?null:+a.monto}));
  if(is('subprog','subplan')) S.perfiles = await q(sb.from('perfiles').select('*').order('creado_at'));
}
async function refresh(){ try{ await Promise.all([loadFeed(), loadInternal()]); render(); } catch(e){ fail(e); } }
const progTotal = id => sum(S.itemsByProg.get(id)||[], i=>i.monto);
const progById = id => S.progs.find(p=>p.id===id);

/* ============ Acceso ============ */
async function loadPerfil(){
  S.perfil=null; if(!S.session) return;
  const r = await sb.from('perfiles').select('*').eq('id', S.session.user.id).maybeSingle();
  S.perfil = r.data || {rol:'lector', email:S.session.user.email, nombre:''};
}
function viewLogin(msg){
  $('#root').innerHTML = `<div class="login">
    <section class="login-art">
      <div class="logo"><div class="lg">M</div><div><b>Municipio de Morón</b><span>Secretaría de Economía y Finanzas</span></div></div>
      <div><h1>Programación de Pagos</h1><p>Preselección, aprobación y seguimiento de los pagos a proveedores, con la previsión de caja de las próximas semanas.</p></div>
      <div></div>
    </section>
    <section class="login-form"><form class="login-card" id="lf">
      <h2>Ingresar</h2><p>Usá el correo y la contraseña que te dieron los subsecretarios.</p>
      <label class="f">Correo<input type="email" id="lm" required autocomplete="username"></label>
      <label class="f">Contraseña<input type="password" id="lp" required autocomplete="current-password"></label>
      <div id="lmsg" class="note bad" ${msg?'':'hidden'}>${esc(msg||'')}</div>
      <button class="btn pri wide" type="submit" id="lb">Ingresar</button>
    </form></section></div>`;
  $('#lf').onsubmit = async ev => {
    ev.preventDefault(); const b=$('#lb'); b.disabled=true; b.textContent='Ingresando…';
    const {error} = await sb.auth.signInWithPassword({email:$('#lm').value.trim(), password:$('#lp').value});
    if(error){ b.disabled=false; b.textContent='Ingresar'; const m=$('#lmsg'); m.hidden=false;
      m.textContent = /invalid/i.test(error.message)?'El correo o la contraseña no coinciden.': /banned/i.test(error.message)?'Esta cuenta está desactivada. Consultá con los subsecretarios.':error.message; }
  };
}
function myAccount(){
  const m=$('#modal'); m.hidden=false; const p=S.perfil||{};
  m.innerHTML=`<form class="dlg" id="maf"><h2>Mi cuenta</h2>
    <div class="row"><div class="av">${esc(initials(p.nombre||p.email))}</div><div><b>${esc(p.nombre||p.email)}</b><div class="cap">${esc(p.cargo||ROLES[realRole()])} · ${esc(p.email||'')}</div></div></div>
    <label class="f">Contraseña nueva<input type="password" id="np1" minlength="8" required autocomplete="new-password"></label>
    <label class="f">Repetila<input type="password" id="np2" minlength="8" required autocomplete="new-password"></label>
    <div class="row"><button class="btn pri" type="submit">Cambiar contraseña</button><span class="sp"></span><button class="btn" type="button" id="mac">Cerrar</button></div></form>`;
  $('#mac').onclick=()=>{ m.hidden=true; m.innerHTML=''; };
  $('#maf').onsubmit=async ev=>{ ev.preventDefault(); if($('#np1').value!==$('#np2').value){ toast('Las contraseñas no coinciden.',true); return; }
    try{ await q(sb.auth.updateUser({password:$('#np1').value})); toast('Contraseña actualizada'); m.hidden=true; m.innerHTML=''; }catch(e){ fail(e); } };
}

/* ============ Estructura ============ */
let CHARTS=[]; function destroyCharts(){ CHARTS.forEach(c=>c.destroy()); CHARTS=[]; }
const main = () => $('#main');
function shell(){
  const p=S.perfil||{};
  const tabs=TABS.filter(t=>t.ok());
  const pend=S.progs.filter(x=>x.estado==='enviada').length, rech=S.progs.filter(x=>x.estado==='rechazada').length;
  const badge=t=> t.id==='revision'&&pend?`<span class="badge">${pend}</span>`: t.id==='presel'&&rech?`<span class="badge">${rech}</span>`:'';
  let nav='', g=null;
  for(const t of tabs){ if(t.g && t.g!==g){ nav+=`<div class="nav-sep">${t.g}</div>`; g=t.g; } nav+=`<a href="#${t.id}" ${S.tab===t.id?'aria-current="page"':''}>${icon(t.i)}<span>${t.t}</span>${badge(t)}</a>`; }
  const av=activeAlerts();
  $('#root').innerHTML = `<div class="app">
    <aside class="side">
      <div class="logo"><div class="lg">M</div><div><b>Programación de Pagos</b><span>Municipio de Morón</span></div></div>
      <nav class="nav" aria-label="Secciones">${nav}</nav>
      <div class="me">

let W=null;
function openWB(p, mode){

        items:new Map(its.map(i=>[i.clave,{...i}])), saved:new Map(its.map(i=>[i.clave,+i.monto])),
        pres:new Map((p?.preseleccion||[]).map(x=>[x.clave,x])), dirty:false,
        f:{q:'',dep:'',ff:'',val:'',edad:'',desde:'',hasta:'',solo:true,ocultar:true,selOnly:mode!=='director'}, sort:{k:'f_factura',d:1}, lim:150, conf:null };
  if(!p) W.titulo='Pago '+fd(W.fecha).slice(0,5);
}
function nextPayDay(){ const d=new Date(); for(let i=1;i<8;i++){ const x=addDays(d,i); if(x.getDay()>=1&&x.getDay()<=5) return iso(x); } return today(); }
const editable = () => W && ((W.mode==='director' && ['borrador','rechazada'].includes(W.estado)) || (W.mode==='subprog' && W.estado==='enviada'));
function enOtras(r){ return Math.max(0, r.en_curso - (W.saved.get(r.clave)||0)); }
function disponible(r){ return Math.max(0, r.pendiente - enOtras(r)); }
function filtered(){
  const f=W.f, ql=f.q.trim().toLowerCase();
  let rows = S.fact.filter(r=>{
    if(f.selOnly && !W.items.has(r.clave)) return false;
    if(ql && !(r.proveedor.toLowerCase().includes(ql) || r.comprobante.includes(ql) || String(r.cprov)===ql || String(r.expediente)===ql)) return false;
    if(f.dep && r.dependencia!==f.dep) return false;
    if(f.ff && String(r.ff)!==f.ff) return false;
    if(f.val && String(!!r.validada)!==f.val) return false;
    if(f.edad && !(r.dias>=+f.edad)) return false;
    if(f.desde && r.f_factura<f.desde) return false;
    if(f.hasta && r.f_factura>f.hasta) return false;
    if(f.solo && r.pendiente<=0 && !W.items.has(r.clave)) return false;
    if(f.ocultar && enOtras(r)>0 && disponible(r)<=0 && !W.items.has(r.clave)) return false;
    return true;
  });
  const {k,d}=W.sort;
  rows.sort((a,b)=>{ let x=a[k],y=b[k]; if(k==='sel'){x=W.items.has(a.clave)?1:0;y=W.items.has(b.clave)?1:0;} if(typeof x==='string'||typeof y==='string') return d*String(x??'').localeCompare(String(y??''),'es'); return d*((x??0)-(y??0)); });
  return rows;
}
function itemFrom(r, monto){ return {clave:r.clave,cprov:r.cprov,proveedor:r.proveedor,dependencia:r.dependencia,ff:r.ff,oc:r.oc,expediente:r.expediente,comprobante:r.comprobante,f_factura:r.f_factura,importe:r.importe,monto:Math.round(monto*100)/100,nota:''}; }
function toggle(clave, on){
  const r=S.factByKey.get(clave);
  if(on){ if(!r) return; const m=disponible(r); if(m<=0){ toast('Esa factura no tiene saldo disponible para programar.',true); return; } W.items.set(clave,itemFrom(r,m)); }
  else W.items.delete(clave);
  W.dirty=true;
}

function wbRow(r, ed){
  const it=W.items.get(r.clave), on=!!it, disp=disponible(r), otras=enOtras(r);
  const pills=[];
  if(r.validada===false) pills.push('<span class="pill mute">No validada</span>');

function bindWB(){
  const r=()=>viewWB();
  $('#wbBack').onclick=()=>{ if(W.dirty && !window.confirm('Hay cambios sin guardar. ¿Salir igual?')) return; W=null; render(); };
  const fl=(k,v)=>{ W.f[k]=v; W.lim=150; r(); };
  $('#wq').oninput=e=>{ W.f.q=e.target.value; clearTimeout(bindWB._t); bindWB._t=setTimeout(()=>{ const p=e.target.selectionStart; fl('q',W.f.q); const i=$('#wq'); i.focus(); i.setSelectionRange(p,p); },250); };
  $('#wdep').onchange=e=>fl('dep',e.target.value); $('#wff').onchange=e=>fl('ff',e.target.value); $('#wval').onchange=e=>fl('val',e.target.value);
  $('#wedad').onchange=e=>fl('edad',e.target.value); $('#wdesde').onchange=e=>fl('desde',e.target.value); $('#whasta').onchange=e=>fl('hasta',e.target.value);
  $('#wsolo').onchange=e=>fl('solo',e.target.checked); $('#wocu').onchange=e=>fl('ocultar',e.target.checked); $('#wsel').onchange=e=>fl('selOnly',e.target.checked);
  document.querySelectorAll('#wtab th[data-s]').forEach(th=>th.onclick=()=>{ const k=th.dataset.s; W.sort = W.sort.k===k?{k,d:-W.sort.d}:{k,d:k==='pendiente'?-1:1}; r(); });
  const more=$('#wMore'); if(more) more.onclick=()=>{ W.lim+=150; r(); };
  const allb=$('#wAll'); if(allb) allb.onclick=()=>{ const rows=filtered(); const allSel=rows.every(x=>W.items.has(x.clave)||disponible(x)<=0); for(const x of rows){ if(allSel) W.items.delete(x.clave); else if(!W.items.has(x.clave) && disponible(x)>0) W.items.set(x.clave,itemFrom(x,disponible(x))); } W.dirty=true; r(); };
  $('#wtab').addEventListener('change',e=>{
    const k=e.target.dataset.k; if(k){ toggle(k,e.target.checked); setTimeout(r,0); return; }
    const mk=e.target.dataset.m; if(mk){ const v=parseAmt(e.target.value); const it=W.items.get(mk); if(!it) return; if(!(v>0)){ toast('El monto tiene que ser mayor a cero.',true); setTimeout(r,0); return; } it.monto=Math.round(v*100)/100; W.dirty=true; setTimeout(r,0); }
  });
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ W.items.delete(b.dataset.rm); W.dirty=true; r(); });
  document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{ const x=W.pres.get(b.dataset.restore); const base=S.factByKey.get(x.clave); W.items.set(x.clave, base?itemFrom(base,+x.monto):{...x,monto:+x.monto}); W.dirty=true; r(); });
  const wf=$('#wfecha'); if(wf) wf.onchange=e=>{ W.fecha=e.target.value||W.fecha; W.dirty=true; setTimeout(r,0); };
  const wt=$('#wtit'); if(wt) wt.oninput=e=>{ W.titulo=e.target.value; W.dirty=true; };
  const wn=$('#wnota'); if(wn) wn.oninput=e=>{ W.nota=e.target.value; W.dirty=true; };
  const on=(id,fn)=>{ const b=$(id); if(b) b.onclick=fn; };
  on('#wSave',()=>wbSave().then(ok=>ok&&toast('Guardado')));
  on('#wSend',async()=>{ const id=await wbSave(); if(!id) return; try{ await q(sb.rpc('enviar_programacion',{p_id:id})); toast('Enviada a aprobación'); W=null; await refresh(); }catch(e){fail(e);} });
  on('#wDesc',()=>{ W.conf='descartar'; r(); });
  on('#wDescOk',async()=>{ try{ await q(sb.rpc('descartar_programacion',{p_id:W.id})); toast('Programación descartada'); W=null; await refresh(); }catch(e){fail(e);} });
  on('#wApr',()=>{ W.conf='aprobar'; r(); }); on('#wRech',()=>{ W.conf='rechazar'; r(); }); on('#wCancel',()=>{ W.conf=null; r(); });
  on('#wAprOk',async()=>{ const obs=$('#wobs').value.trim(); if(W.dirty && !(await wbSave())) return; try{ await q(sb.rpc('aprobar_programacion',{p_id:W.id,p_observacion:obs})); toast('Programación aprobada'); W=null; S.feedItems.clear(); await refresh(); }catch(e){fail(e);} });
  on('#wRechOk',async()=>{ const obs=$('#wobs').value.trim(); if(!obs){ toast('Escribí el motivo del rechazo.',true); return; } if(W.dirty && !(await wbSave())) return; try{ await q(sb.rpc('rechazar_programacion',{p_id:W.id,p_observacion:obs})); toast('Programación devuelta al Director'); W=null; await refresh(); }catch(e){fail(e);} });
  on('#wXls',()=>exportProg(W.id,'xlsx')); on('#wHist',()=>showHist(W.id));
}
async function wbSave(){
  const items=[...W.items.values()].map(i=>({clave:i.clave,cprov:i.cprov,proveedor:i.proveedor,dependencia:i.dependencia,ff:i.ff,oc:i.oc,expediente:i.expediente,comprobante:i.comprobante,f_factura:i.f_factura,importe:i.importe,monto:i.monto,nota:i.nota||''}));
  const over=items.filter(i=>{ const r=S.factByKey.get(i.clave); return r && i.monto>disponible(r)+0.5; });
  if(over.length){ toast(`${over.length} ${over.length===1?'factura supera':'facturas superan'} el saldo disponible. Revisá los montos marcados.`,true); return null; }
  try{
    const id = await q(sb.rpc('guardar_programacion',{p_id:W.id,p_fecha:W.fecha,p_titulo:W.titulo,p_nota:W.nota,p_items:items}));
    const keep={mode:W.mode,f:W.f,sort:W.sort};
    await Promise.all([loadFeed(),loadInternal()]);
    openWB(progById(id),keep.mode); Object.assign(W,{f:keep.f,sort:keep.sort}); render();
    return id;
  }catch(e){ fail(e); return null; }
}

function parseProv(s){ const m=String(s).match(/^(.*) · (\d+)$/); return m?{proveedor:m[1].trim(),cprov:+m[2]}:{proveedor:String(s).trim(),cprov:null}; }
function schedule(F){
  const n=Math.max(1,Math.min(60,+F.cant||1)), tot=Math.round((+F.total||0)*100), base=Math.floor(tot/n);
  const out=[], d0=pd(F.prim);
  for(let i=0;i<n;i++){ let d; if(F.mensual){ d=new Date(d0.getFullYear(),d0.getMonth()+i,1); d.setDate(Math.min(d0.getDate(), new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); } else d=addDays(d0,i*(+F.cada||30));

  return out;
}

function normH(s){ return String(s??'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z]/g,''); }

const HMAP={APAGAR:'apagar',MONTO:'apagar',EJ:'ej',CPROV:'cprov',PROVEEDOR:'proveedor',DEPDESC:'dependencia',DEPENDENCIA:'dependencia',JUR:'jur',FF:'ff',FFIN:'ff',OCNRO:'oc',OC:'oc',EXPED:'expediente',EXPEDIENTE:'expediente',COMPROBANTE:'comprobante',FFACTURA:'f_factura',FVENC:'f_venc',IMPORTE:'importe',PAGADO:'pagado',SALDO:'saldo',VAL:'validada',VALIDADA:'validada'};
function cellDate(v, X){
  if(v==null||v==='') return null;
  if(v instanceof Date) return iso(new Date(v.getTime()+12*3600e3));
  if(typeof v==='number'){ const d=X.SSF.parse_date_code(v); return d? `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:null; }
  const m=String(v).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  const m2=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m2?m2[0]:null;
}
function cellNum(v){ if(v==null||v==='') return null; if(typeof v==='number') return v; return parseAmt(v); }
async function readListado(file, need){
  const X=await loadXlsx(); const wb=X.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const names=wb.SheetNames.includes('GENERAL')?['GENERAL',...wb.SheetNames.filter(n=>n!=='GENERAL')]:wb.SheetNames;
  let found=null;
  for(const n of names){ const aoa=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}); const hi=aoa.findIndex(r=>r&&r.some(c=>normH(c)==='CPROV')&&r.some(c=>normH(c)==='COMPROBANTE')); if(hi>=0){ found={n,aoa,hi}; break; } }
  if(!found) throw new Error('No encontré una hoja con columnas C.PROV y COMPROBANTE.');
  const head=found.aoa[found.hi].map(c=>HMAP[normH(c)]||null);
  for(const k of need) if(!head.includes(k)) throw new Error('Falta la columna '+({cprov:'C.PROV',f_factura:'F.Factura'}[k]||k.toUpperCase())+' en la hoja '+found.n+'.');
  const rows=[]; let skip=0, ejemplo=0; const badFF=[];
  for(const r of found.aoa.slice(found.hi+1)){
    if(!r) continue; const o={}; head.forEach((k,i)=>{ if(k) o[k]=r[i]; });
    const cprov=cellNum(o.cprov), comp=String(o.comprobante??'').trim(), prov=String(o.proveedor??'').replace(/\s+/g,' ').trim();
    if(/^EJEMPLO/i.test(prov) || cprov===0){ ejemplo++; continue; }
    if(!cprov||!comp){ skip++; continue; }
    const ff=cellNum(o.ff);
    if(head.includes('ff') && !FFS.includes(ff)){ badFF.push(comp); continue; }
    const val=String(o.validada??'').trim().toUpperCase();
    rows.push({ej:cellNum(o.ej),cprov:Math.round(cprov),proveedor:prov,dependencia:String(o.dependencia??'').replace(/\s+/g,' ').trim(),jur:cellNum(o.jur),ff,oc:cellNum(o.oc),expediente:cellNum(o.expediente),
      comprobante:comp,f_factura:cellDate(o.f_factura,X),f_venc:cellDate(o.f_venc,X),importe:cellNum(o.importe)||0,pagado:cellNum(o.pagado)||0,saldo:o.saldo==null?null:cellNum(o.saldo),validada:val==='SI'?true:val==='NO'?false:null,apagar:cellNum(o.apagar)});
  }
  return {sheet:found.n, rows, skip, ejemplo, badFF};
}
async function parseUpload(file){
  try{
    toast('Leyendo '+file.name+'…');

    const rows=L.rows.map(({apagar,...r})=>r);
    const keys=new Set(rows.map(r=>r.cprov+'|'+r.comprobante)), old=new Map(S.fact.map(r=>[r.clave,r]));
    const nuevas=rows.filter(r=>!old.has(r.cprov+'|'+r.comprobante)), salen=S.fact.filter(r=>!keys.has(r.clave));
    const cambian=rows.filter(r=>{ const o=old.get(r.cprov+'|'+r.comprobante); return o && Math.abs((r.saldo??r.importe-r.pagado)-o.saldo)>0.5; });
    const m=file.name.match(/(\d{1,2})[-_.](\d{1,2})(?:[-_.](\d{2,4}))?/);
    let corte=today(); if(m){ const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):new Date().getFullYear(); corte=`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }

    viewBase();
  }catch(e){ fail(e); }
}
async function importAPagar(file){

    W.imp={file:file.name, ok, ajust, sinSaldo, notFound}; W.dirty=true; W.f.selOnly=true;
    viewWB();
  }catch(e){ fail(e); }
}

let ALF=null;
function paidIn(cprov, y, m, w, estados){
  const [a,b]=womRange(y,m,w); const A=iso(a), B=iso(b); let t=0;
  for(const p of S.progs){ if(!estados.includes(p.estado)||p.fecha_pago<A||p.fecha_pago>B) continue; for(const i of S.itemsByProg.get(p.id)||[]) if(cprov==null||i.cprov===cprov) t+=i.monto; }
  return t;
}
function evalAlert(a, y, m){
  const t=today();
  if(a.tipo==='proveedor'){
    const [A,B]=womRange(y,m,a.semana); const pag=paidIn(a.cprov,y,m,a.semana,['aprobada']); const cur=paidIn(a.cprov,y,m,a.semana,['borrador','enviada']);
    let st, cls;
    if(pag>=a.monto-0.5){ st='Cumplida'; cls='ok'; }
    else if(iso(B)<t){ st='Incumplida'; cls='bad'; }
    else if(pag+cur>=a.monto-0.5){ st='En programación'; cls='info'; }
    else if(iso(A)<=t){ st='Pendiente esta semana'; cls='warn'; }
    else { const days=(A-new Date())/864e5; st=days<=7?'Próxima semana':'Programada'; cls=days<=7?'warn':'info'; }
    return {st,cls,pag,cur,A,B};
  }
  if(a.tipo==='tope_semanal'){ const res=[1,2,3,4].map(w=>({w,t:paidIn(null,y,m,w,['aprobada','borrador','enviada'])})); const ex=res.filter(r=>r.t>a.monto+0.5); return {st:ex.length?'Tope superado':'Dentro del tope', cls:ex.length?'bad':'ok', res, ex}; }
  const l=S.fact.filter(r=>r.pendiente>0&&r.dias>a.dias&&r.en_curso<=0);
  return {st:l.length?`${l.length} facturas sin programar`:'Sin facturas', cls:l.length?'warn':'ok', n:l.length, amt:sum(l,r=>r.pendiente)};
}
function alertApplies(a, y, m){ if(!a.activa) return false; if(!a.mes) return true; const d=pd(a.mes); return d.getFullYear()===y&&d.getMonth()===m; }
function alertText(a){
  if(a.tipo==='proveedor') return `Pagar a <b>${esc(a.proveedor)}</b> ${money(a.monto)} en la semana ${a.semana} de ${a.mes?MES[pd(a.mes).getMonth()]:'cada mes'}`;
  if(a.tipo==='tope_semanal') return `No superar ${money(a.monto)} programados por semana${a.mes?' en '+MES[pd(a.mes).getMonth()]:''}`;
  return `Facturas con más de ${a.dias} días sin programar`;
}
function activeAlerts(){
  if(!is('director','subprog','subplan')) return [];
  const d=new Date(), y=d.getFullYear(), m=d.getMonth(), out=[];
  for(const a of S.alertas){ if(!alertApplies(a,y,m)) continue; const e=evalAlert(a,y,m);
    if(a.tipo==='proveedor' && ['Pendiente esta semana','Próxima semana','Incumplida'].includes(e.st)) out.push({cls:e.cls==='bad'?'bad':'warn',st:e.st,html:`${alertText(a)}. Pagado ${money(e.pag)}${e.cur?`, en curso ${money(e.cur)}`:''}.${a.nota?' '+esc(a.nota):''}`});
    if(a.tipo==='tope_semanal' && e.ex.length) out.push({cls:'bad',st:'Tope superado',html:`${alertText(a)}. Semana ${e.ex.map(x=>x.w+': '+mm(x.t)).join(', ')}.`});
    if(a.tipo==='antiguedad' && e.n) out.push({cls:'warn',st:'Facturas viejas',html:`${alertText(a)}: ${e.n} por ${mm(e.amt)}.`}); }
  return out;
}
function alertsForDate(fecha, items){
  const d=pd(fecha), y=d.getFullYear(), m=d.getMonth(), w=wom(fecha), out=[];
  for(const a of S.alertas){ if(!alertApplies(a,y,m)) continue;
    if(a.tipo==='proveedor' && a.semana===w){
      const here=sum(items.filter(i=>i.cprov===a.cprov),i=>i.monto);
      const other=paidIn(a.cprov,y,m,w,['aprobada']) - (W&&W.estado==='aprobada'?here:0);
      const tot=here+other, ok=tot>=a.monto-0.5;
      out.push({cls:ok?'ok':'warn',html:`${alertText(a)}.<br>En esta programación: <b class="amt">${money(here)}</b>${other?` · ya aprobado ${money(other)}`:''}. ${ok?'Cumplida.':'Faltan '+money(a.monto-tot)+'.'} ${!ok&&editable()?`<button class="link" onclick="W.f.q='${a.cprov}';W.lim=150;viewWB()">Ver sus facturas</button>`:''}`});
    }
    if(a.tipo==='tope_semanal'){ const tot=paidIn(null,y,m,w,['aprobada','borrador','enviada']) - sum([...W.saved.values()]) + sum(items,i=>i.monto);
      if(tot>a.monto+0.5) out.push({cls:'bad',html:`${alertText(a)}. Con esta programación la semana ${w} suma <b class="amt">${money(tot)}</b>.`}); }
  }
  return out;
}

/* ============ Proveedores: cuenta corriente ============ */
let PV=null, PVF={q:'',sort:'deuda'};
function provIndex(){
  const m=new Map();
  const get=(c,n)=>{ if(!m.has(c)) m.set(c,{cprov:c,n,deuda:0,imp:0,wsum:0,maxd:0,fact:0,pagado:0,ult:null,curso:0,chq:0}); return m.get(c); };
  for(const r of S.fact){ const o=get(r.cprov,r.proveedor); if(r.pendiente>0){ o.deuda+=r.pendiente; o.fact++; o.wsum+=r.pendiente*(r.dias||0); o.maxd=Math.max(o.maxd,r.dias||0); } o.curso+=r.en_curso; }
  for(const p of S.progs){ if(p.estado!=='aprobada') continue; for(const i of S.itemsByProg.get(p.id)||[]){ const o=get(i.cprov,i.proveedor); o.pagado+=i.monto; if(!o.ult||p.fecha_pago>o.ult) o.ult=p.fecha_pago; } }
  for(const c of S.cheques){ if(!c.cprov||!['emitido','entregado'].includes(c.estado)) continue; get(c.cprov,c.proveedor).chq+=c.monto; }
  for(const o of m.values()) o.edad=o.deuda>0?o.wsum/o.deuda:0;
  return [...m.values()];
}

        <td class="n">${o.deuda?nf0.format(o.edad)+' días':'—'}</td><td class="n">${o.maxd?o.maxd+' días':'—'}</td><td class="n">${o.pagado?money(o.pagado):'—'}</td><td class="n">${o.ult?fd(o.ult):'—'}</td><td class="n">${o.curso?money(o.curso):'—'}</td></tr>`).join('')}</tbody></table></div>`

function cuentaCorriente(cprov){
  const corte=S.carga?.corte||today(), desde=S.carga?.descontar_desde||'0000';
  const base=S.fact.filter(r=>r.cprov===cprov);
  const baseKeys=new Set(base.map(r=>r.clave));
  const pagos=[]; for(const p of S.progs){ if(p.estado!=='aprobada') continue; for(const i of S.itemsByProg.get(p.id)||[]) if(i.cprov===cprov) pagos.push({p,i}); }
  const mov=[];
  for(const r of base){
    mov.push({f:r.f_factura||corte, t:'Factura', c:`${r.comprobante} · ${r.dependencia||''}`, d:r.importe, h:0});
    if(r.pagado>0.5) mov.push({f:corte, t:'Pagado según listado', c:`${r.comprobante} · pagos registrados al ${fd(corte)}`, d:0, h:r.pagado});
    else if(r.importe-r.saldo>0.5) mov.push({f:corte, t:'Ajuste del listado', c:`${r.comprobante} · diferencia entre importe y saldo`, d:0, h:r.importe-r.saldo});
  }
  const fuera=new Map();
  for(const {p,i} of pagos){
    if(baseKeys.has(i.clave)){ if(p.fecha_pago>=desde) mov.push({f:p.fecha_pago, t:'Pago aprobado', c:`${i.comprobante} · ${p.titulo||'Pago '+fd(p.fecha_pago)}`, d:0, h:i.monto}); }
    else { if(!fuera.has(i.clave)) fuera.set(i.clave,{i,pag:0}); fuera.get(i.clave).pag+=i.monto; mov.push({f:p.fecha_pago, t:'Pago aprobado', c:`${i.comprobante} · ${p.titulo||'Pago '+fd(p.fecha_pago)}`, d:0, h:i.monto}); }
  }
  for(const {i,pag} of fuera.values()){
    mov.push({f:i.f_factura||corte, t:'Factura', c:`${i.comprobante} · ${i.dependencia||''} (ya no figura en el listado)`, d:+i.importe, h:0});
    if(+i.importe-pag>0.5) mov.push({f:corte, t:'Saldada fuera del portal', c:`${i.comprobante} · no figura en el listado al ${fd(corte)}`, d:0, h:+i.importe-pag});
  }
  const ord={'Factura':0,'Pagado según listado':1,'Ajuste del listado':1,'Saldada fuera del portal':1,'Pago aprobado':2};
  mov.sort((a,b)=>a.f.localeCompare(b.f)||ord[a.t]-ord[b.t]);
  let s=0; for(const m of mov){ s+=m.d-m.h; m.s=s; }
  return {mov, base, pagos};
}
function viewProveedor(cprov){
  const o=provIndex().find(x=>x.cprov===cprov); if(!o){ PV=null; return viewProveedores(); }
  const {mov, base, pagos}=cuentaCorriente(cprov);
  const imp=base.filter(r=>r.pendiente>0).sort((a,b)=>(b.dias||0)-(a.dias||0));
  const chq=S.cheques.filter(c=>c.cprov===cprov).sort((a,b)=>a.f_vencimiento.localeCompare(b.f_vencimiento));
  const curso=S.progs.filter(p=>['borrador','enviada'].includes(p.estado)).map(p=>({p,t:sum((S.itemsByProg.get(p.id)||[]).filter(i=>i.cprov===cprov),i=>i.monto)})).filter(x=>x.t>0);
  main().innerHTML=`
    <div><button class="link" id="pvBack">← Todos los proveedores</button></div>
    <section class="hero"><div style="position:relative;z-index:1">
      <div class="lbl">${esc(o.n)} · C.Prov ${o.cprov}</div>
      <div class="big amt">${moneyH(o.deuda)}</div>
      <div class="chips"><span>${o.fact} ${o.fact===1?'factura impaga':'facturas impagas'}</span><span>Antigüedad ponderada ${nf0.format(o.edad)} días</span><span>Más vieja ${o.maxd} días</span><span>Último pago ${o.ult?fd(o.ult):'—'}</span></div></div>
      <div style="position:relative;z-index:1;text-align:right" class="lbl">Deuda pendiente<br>neta de pagos aprobados</div></section>
    <div class="stats">
      <div class="stat"><span class="k">Pagado en programaciones aprobadas</span><span class="v amt">${mm(o.pagado)}</span><span class="s">${pagos.length} ${pagos.length===1?'factura':'facturas'}</span></div>
      <div class="stat"><span class="k">En programaciones en curso</span><span class="v amt">${mm(sum(curso,x=>x.t))}</span><span class="s">${curso.length?curso.map(x=>esc(x.p.titulo||fd(x.p.fecha_pago))).join(', '):'ninguna'}</span></div>
      <div class="stat"><span class="k">Cheques diferidos vigentes</span><span class="v amt">${mm(o.chq)}</span><span class="s">${chq.filter(c=>['emitido','entregado'].includes(c.estado)).length} cheques</span></div>
    </div>
    <div class="grid">
      <section class="card c7"><h3>Pagos recibidos</h3><p class="cap">Programaciones aprobadas y cheques diferidos, por fecha.</p><div class="chart sm" style="margin-top:10px"><canvas id="chPvPag"></canvas></div></section>
      <section class="card c5"><h3>Antigüedad de la deuda</h3><p class="cap">Saldo pendiente según días desde la factura.</p><div class="chart sm" style="margin-top:10px"><canvas id="chPvAge"></canvas></div></section>
    </div>
    <section class="card"><div class="sect"><div><h3>Cuenta corriente</h3><p class="cap">Debe: facturas. Haber: pagos registrados en el listado y pagos aprobados en el portal. El saldo final coincide con la deuda pendiente.</p></div><button class="btn sm" id="pvCsv">${icon('dl')}CSV</button></div>
      <div class="tw tall" style="margin-top:12px"><table><thead><tr><th>Fecha</th><th>Movimiento</th><th>Detalle</th><th class="n">Debe</th><th class="n">Haber</th><th class="n">Saldo</th></tr></thead><tbody>
      ${mov.map(m=>`<tr><td class="nw">${fd(m.f)}</td><td class="nw">${m.t==='Factura'?'<span class="pill mute plain">Factura</span>':m.t==='Pago aprobado'?'<span class="pill ok plain">Pago aprobado</span>':`<span class="pill mute plain">${esc(m.t)}</span>`}</td><td>${esc(m.c)}</td><td class="n">${m.d?money(m.d):''}</td><td class="n">${m.h?money(m.h):''}</td><td class="n"><b>${money(m.s)}</b></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3">Saldo</td><td class="n">${money(sum(mov,m=>m.d))}</td><td class="n">${money(sum(mov,m=>m.h))}</td><td class="n">${money(mov.length?mov[mov.length-1].s:0)}</td></tr></tfoot></table></div></section>
    <section class="card"><h3>Facturas impagas (${imp.length})</h3>
      ${imp.length?`<div class="tw tall" style="margin-top:12px"><table><thead><tr><th>Comprobante</th><th>Dependencia</th><th class="c">FF</th><th>F. factura</th><th class="n">Días</th><th class="n">Importe</th><th class="n">Pendiente</th><th>Estado</th></tr></thead><tbody>
      ${imp.map(r=>`<tr><td class="nw">${esc(r.comprobante)}<span class="sub">Exp. ${r.expediente??'—'} · OC ${r.oc??'—'}</span></td><td>${esc(r.dependencia||'')}</td><td class="c">${r.ff??''}</td><td class="nw">${fd(r.f_factura)}</td><td class="n">${r.dias??''}</td><td class="n">${money(r.importe)}</td><td class="n"><b>${money(r.pendiente)}</b></td><td>${r.en_curso>0?'<span class="pill warn">En programación</span>':r.dias>60?'<span class="pill bad">+60 días</span>':''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="cap">No tiene facturas impagas en la base.</p>'}</section>
    ${chq.length?`<section class="card"><h3>Cheques diferidos</h3><div class="tw" style="margin-top:12px"><table><thead><tr><th>Vencimiento</th><th>Número · banco</th><th>Concepto</th><th class="n">Monto</th><th>Estado</th></tr></thead><tbody>
      ${chq.map(c=>`<tr><td class="nw">${fd(c.f_vencimiento)}</td><td class="nw">${esc(c.numero||'—')}<span class="sub">${esc(c.banco||'')}</span></td><td>${esc(c.concepto)}</td><td class="n">${money(c.monto)}</td><td><span class="pill ${c.estado==='debitado'?'ok':c.estado==='anulado'?'mute':'info'}">${c.estado}</span></td></tr>`).join('')}</tbody></table></div></section>`:''}`;
  $('#pvBack').onclick=()=>{ PV=null; viewProveedores(); };
  $('#pvCsv').onclick=()=>download(`cuenta_corriente_${cprov}.csv`, new Blob([csv([['Fecha','Movimiento','Detalle','Debe','Haber','Saldo'],...mov.map(m=>[fd(m.f),m.t,m.c,m.d,m.h,m.s])])],{type:'text/csv'}));
  const byD=new Map(); for(const {p,i} of pagos){ const k=p.fecha_pago; const x=byD.get(k)||{f:0,c:0}; x.f+=i.monto; byD.set(k,x); }
  for(const c of chq){ if(c.estado==='anulado') continue; const x=byD.get(c.f_vencimiento)||{f:0,c:0}; x.c+=c.monto; byD.set(c.f_vencimiento,x); }
  const ks=[...byD.keys()].sort();
  if(ks.length) chart('#chPvPag',{type:'bar',data:{labels:ks.map(k=>fd(k).slice(0,5)+(k>today()?' (vence)':'')),datasets:[{label:'Programaciones aprobadas',data:ks.map(k=>byD.get(k).f/1e6),backgroundColor:css('--s3'),stack:'a',borderRadius:6,maxBarThickness:40},{label:'Cheques',data:ks.map(k=>byD.get(k).c/1e6),backgroundColor:css('--s4'),stack:'a',borderRadius:6,maxBarThickness:40}]},
    options:{plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,boxHeight:10}},tooltip:{callbacks:{label:c=>c.dataset.label+': $ '+nf1.format(c.raw)+' M'}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,ticks:{callback:v=>nf1.format(v)+' M'}}}}});
  else $('#chPvPag').parentElement.innerHTML='<div class="empty" style="border:0"><b>Sin pagos aprobados</b>Todavía no se le aprobó ningún pago en el portal.</div>';
  const buckets=[['0–30',0,30],['31–60',31,60],['61–90',61,90],['91–180',91,180],['181–365',181,365],['+365',366,1e9]];
  chart('#chPvAge',{type:'bar',data:{labels:buckets.map(b=>b[0]),datasets:[{data:buckets.map(([,a,b])=>sum(imp.filter(r=>r.dias>=a&&r.dias<=b),r=>r.pendiente)/1e6),backgroundColor:buckets.map((b,i)=>i<2?css('--s3'):css('--s1')),borderRadius:6,maxBarThickness:46}]},
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'$ '+nf1.format(c.raw)+' M'}}},scales:{x:{grid:{display:false},title:{display:true,text:'días'}},y:{beginAtZero:true,ticks:{callback:v=>nf1.format(v)+' M'}}}}});
}

/* ============ Arranque ============ */
(async function boot(){
  try{ const v=localStorage.getItem('viewAs'); if(v) S.viewAs=v; }catch(e){}
  S.tab = location.hash.slice(1) || 'inicio';
  const { data:{ session } } = await sb.auth.getSession();
  S.session=session;
  if(session){ await loadPerfil(); await refresh(); } else viewLogin();
  sb.auth.onAuthStateChange(async (ev, session)=>{
    if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'){
      if((session?.user?.id||null)===(S.session?.user?.id||null)) return;
      S.session=session; W=null; S.feedItems.clear();
      if(!session){ viewLogin(); return; }
      await loadPerfil(); await refresh();
    }
  });
})().catch(e=>{ $('#root').innerHTML=`<div class="empty" style="margin:40px auto;max-width:520px"><b>No se pudo conectar con la base de datos</b>${esc(e.message||e)}. Revisá la conexión y recargá la página.</div>`; });
</script>
</body>
