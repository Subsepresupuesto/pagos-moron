  const byMonth=new Map(); for(const r of fut){ const k=monthKey(r.semana); const o=byMonth.get(k)||{c:0,v:0,h:0}; o.c+=+r.prev_corriente; o.v+=+r.prev_vencido; o.h+=+r.prev_cheques; byMonth.set(k,o); }
  $('#tbFlow').innerHTML=`<table><thead><tr><th>Semana</th><th class="n">Pagado facturas</th><th class="n">Pagado cheques</th><th class="n">Prev. vencido</th><th class="n">Prev. a ${AN.plazo} días</th><th class="n">Prev. cheques</th><th class="n">Total</th></tr></thead><tbody>
    ${ws.map(r=>{ const t=+r.pagado_facturas+ +r.pagado_cheques+ +r.prev_vencido+ +r.prev_corriente+ +r.prev_cheques; if(!t && r.semana!==w0) return ''; return `<tr class="${r.semana===w0?'sel':''}"><td>${fd(r.semana)}${r.semana===w0?' <span class="pill ink">actual</span>':''}</td><td class="n">${+r.pagado_facturas?money(r.pagado_facturas):'—'}</td><td class="n">${+r.pagado_cheques?money(r.pagado_cheques):'—'}</td><td class="n">${+r.prev_vencido?money(r.prev_vencido):'—'}</td><td class="n">${+r.prev_corriente?money(r.prev_corriente):'—'}</td><td class="n">${+r.prev_cheques?money(r.prev_cheques):'—'}</td><td class="n">${money(t)}</td></tr>`; }).join('')}
    <tr><td>Después del horizonte</td><td></td><td></td><td class="n">${+post.prev_vencido?money(post.prev_vencido):'—'}</td><td class="n">${money(post.prev_corriente)}</td><td class="n">${money(post.prev_cheques)}</td><td class="n">${money(+post.prev_corriente+ +post.prev_cheques+ +post.prev_vencido)}</td></tr></tbody></table>
    <h4 class="eyebrow" style="margin:14px 0 6px">Previsión por mes</h4><table><thead><tr><th>Mes</th><th class="n">Vencido</th><th class="n">A ${AN.plazo} días</th><th class="n">Cheques</th><th class="n">Total</th></tr></thead><tbody>
    ${[...byMonth.entries()].map(([k,o])=>`<tr><td>${monthName(k)}</td><td class="n">${money(o.v)}</td><td class="n">${money(o.c)}</td><td class="n">${money(o.h)}</td><td class="n">${money(o.v+o.c+o.h)}</td></tr>`).join('')}</tbody></table>`;
}
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const wd=(x.getDay()+6)%7; return addDays(x,-wd); }

/* ============ Alertas ============ */
let ALF=null;
function paidIn(cprov, y, m, w, estados){
  const [a,b]=womRange(y,m,w); const A=iso(a), B=iso(b);
  let t=0; for(const p of S.progs){ if(!estados.includes(p.estado)||p.fecha_pago<A||p.fecha_pago>B) continue; for(const i of S.itemsByProg.get(p.id)||[]) if(cprov==null||i.cprov===cprov) t+=i.monto; }
  return t;
}
function evalAlert(a, y, m){
  const t=today();
  if(a.tipo==='proveedor'){
    const [A,B]=womRange(y,m,a.semana); const pag=paidIn(a.cprov,y,m,a.semana,['aprobada']); const cur=paidIn(a.cprov,y,m,a.semana,['borrador','enviada']);
    let st, cls;
    if(pag>=a.monto-0.5){ st='Cumplida'; cls='ok'; }
    else if(iso(B)<t){ st='Incumplida'; cls='bad'; }
    else if(pag+cur>=a.monto-0.5){ st='En programación'; cls='info'; }
    else if(iso(A)<=t){ st='Pendiente esta semana'; cls='warn'; }
    else { const days=(A-new Date())/864e5; st=days<=7?'Próxima semana':'Programada'; cls=days<=7?'warn':'info'; }
    return {st,cls,pag,cur,A,B};
  }
  if(a.tipo==='tope_semanal'){
    const res=[1,2,3,4].map(w=>({w,t:paidIn(null,y,m,w,['aprobada','borrador','enviada'])}));
    const ex=res.filter(r=>r.t>a.monto+0.5);
    return {st:ex.length?'Tope superado':'Dentro del tope', cls:ex.length?'bad':'ok', res, ex};
  }
  if(a.tipo==='antiguedad'){
    const l=S.fact.filter(r=>r.pendiente>0&&r.dias>a.dias&&r.en_curso<=0);
    return {st:l.length?`${l.length} facturas sin programar`:'Sin facturas', cls:l.length?'warn':'ok', n:l.length, amt:sum(l,r=>r.pendiente)};
  }
}
function alertApplies(a, y, m){ if(!a.activa) return false; if(!a.mes) return true; const d=pd(a.mes); return d.getFullYear()===y&&d.getMonth()===m; }
function alertText(a){
  if(a.tipo==='proveedor') return `Pagar a <b>${esc(a.proveedor)}</b> ${money(a.monto)} en la semana ${a.semana} de ${a.mes?MES[pd(a.mes).getMonth()]:'cada mes'}`;
  if(a.tipo==='tope_semanal') return `No superar ${money(a.monto)} programados por semana${a.mes?' en '+MES[pd(a.mes).getMonth()]:''}`;
  return `Facturas con más de ${a.dias} días sin programar`;
}
function activeAlerts(){
  if(!is('director','subprog')) return [];
  const d=new Date(), y=d.getFullYear(), m=d.getMonth(); const out=[];
  for(const a of S.alertas){ if(!alertApplies(a,y,m)) continue; const e=evalAlert(a,y,m);
    if(a.tipo==='proveedor' && ['Pendiente esta semana','Próxima semana','Incumplida'].includes(e.st)) out.push({cls:e.cls==='bad'?'bad':'warn',st:e.st,html:`${alertText(a)} · pagado ${money(e.pag)}${e.cur?` · en curso ${money(e.cur)}`:''}${a.nota?' · '+esc(a.nota):''}`});
    if(a.tipo==='tope_semanal' && e.ex.length) out.push({cls:'bad',st:'Tope',html:`${alertText(a)} · semana ${e.ex.map(x=>x.w+': '+mm(x.t)).join(', ')}`});
    if(a.tipo==='antiguedad' && e.n) out.push({cls:'warn',st:'Antigüedad',html:`${alertText(a)}: ${e.n} por ${mm(e.amt)}`}); }
  return out;
}
function alertsForDate(fecha, items){
  const d=pd(fecha), y=d.getFullYear(), m=d.getMonth(), w=wom(fecha); const out=[];
  for(const a of S.alertas){ if(!alertApplies(a,y,m)) continue;
    if(a.tipo==='proveedor' && a.semana===w){
      const here=sum(items.filter(i=>i.cprov===a.cprov),i=>i.monto);
      const otherApproved=paidIn(a.cprov,y,m,w,['aprobada']) - (W&&W.estado==='aprobada'?here:0);
      const tot=here+otherApproved; const ok=tot>=a.monto-0.5;
      out.push({cls:ok?'ok':'warn',html:`${alertText(a)}.<br>En esta programación: <b class="num">${money(here)}</b>${otherApproved?` · ya aprobado: ${money(otherApproved)}`:''}. ${ok?'Cumplida.':'Faltan '+money(a.monto-tot)+'.'} ${!ok&&editable()?`<button class="link" onclick="W.f.q='${a.cprov}';W.lim=150;viewWB()">Ver facturas del proveedor</button>`:''}`});
    }
    if(a.tipo==='tope_semanal'){ const others=paidIn(null,y,m,w,['aprobada','borrador','enviada']) - sum([...W.saved.values()]); const tot=others+sum(items,i=>i.monto);
      if(tot>a.monto+0.5) out.push({cls:'bad',html:`${alertText(a)}. Con esta programación la semana ${w} suma <b class="num">${money(tot)}</b>.`}); }
  }
  return out;
}
function renderAlertBand(){
  const l=activeAlerts(); const band=$('#alertband');
  if(!l.length){ band.hidden=true; return; }
  band.hidden=false;
  $('#alertlist').innerHTML=l.slice(0,5).map(a=>`<div class="al"><span class="sev ${a.cls}">${esc(a.st)}</span><span>${a.html}</span></div>`).join('')+(l.length>5?`<div class="al"><a href="#alertas">Ver ${l.length-5} alertas más</a></div>`:'');
}
function viewAlertas(){
  const canEdit=is('subprog'); const d=new Date(), y=d.getFullYear(), m=d.getMonth();
  main().innerHTML=`<div class="view">
    <div class="head"><div><div class="eyebrow">Subsecretaría de Programación Financiera</div><h1>Alertas de programación</h1><p>Compromisos y límites que se controlan contra las programaciones. Aparecen arriba de todo para la Subsecretaría y para el Director de Pagos, y dentro del editor cuando la fecha de pago cae en la semana de la alerta.</p></div>
      ${canEdit?'<button class="btn pri" id="alNew">Nueva alerta</button>':''}</div>
    ${ALF?alertForm():''}
    <div class="note">Semanas del mes: <b>1</b> del 1 al 7 · <b>2</b> del 8 al 14 · <b>3</b> del 15 al 21 · <b>4</b> del 22 a fin de mes. Hoy es la semana ${wom(today())} de ${MES[m]}.</div>
    ${S.alertas.length?`<div class="tw"><table><thead><tr><th>Alerta</th><th>Vigencia</th><th>Estado en ${MES[m]}</th><th>Detalle</th><th>Nota</th>${canEdit?'<th></th>':''}</tr></thead><tbody>
      ${S.alertas.map(a=>{ const e=evalAlert(a,y,m); const appl=alertApplies(a,y,m);
        const det = a.tipo==='proveedor'?`Pagado ${money(e.pag)}${e.cur?` · en curso ${money(e.cur)}`:''}<span class="sub">${fd(iso(e.A))} al ${fd(iso(e.B))}</span>`: a.tipo==='tope_semanal'? e.res.map(r=>`S${r.w}: ${mm(r.t)}`).join(' · ') : `${e.n} facturas · ${mm(e.amt)}`;
        return `<tr class="${a.activa?'':'dim'}"><td>${alertText(a)}</td><td>${a.mes?monthName(a.mes.slice(0,7)):'Todos los meses'}${a.activa?'':'<span class="sub">desactivada</span>'}</td>
          <td>${appl?`<span class="pill ${e.cls==='info'?'ink':e.cls}">${e.st}</span>`:'<span class="pill mute">No aplica este mes</span>'}</td><td>${det}</td><td>${esc(a.nota)}</td>
          ${canEdit?`<td><div class="row"><button class="btn sm" data-tg="${a.id}">${a.activa?'Desactivar':'Activar'}</button><button class="btn sm" data-ad="${a.id}">Eliminar</button></div></td>`:''}</tr>`; }).join('')}</tbody></table></div>`
      :`<div class="empty"><b>No hay alertas cargadas</b>${canEdit?'Creá una para recordar un pago comprometido con un proveedor, poner un tope semanal o vigilar facturas viejas.':'La Subsecretaría de Programación Financiera define las alertas.'}</div>`}
  </div>`;
  const on=(id,fn)=>{ const b=$(id); if(b) b.onclick=fn; };
  on('#alNew',()=>{ ALF={tipo:'proveedor'}; viewAlertas(); });
  main().querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{ const a=S.alertas.find(x=>x.id===+b.dataset.tg); try{ await q(sb.from('alertas').update({activa:!a.activa}).eq('id',a.id)); await refresh(); }catch(e){fail(e);} });
  main().querySelectorAll('[data-ad]').forEach(b=>b.onclick=async()=>{ if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='¿Confirmar?'; b.classList.add('bad'); return; } try{ await q(sb.from('alertas').delete().eq('id',+b.dataset.ad)); toast('Alerta eliminada'); await refresh(); }catch(e){fail(e);} });
  if(ALF) bindAlertForm();
}
function alertForm(){
  const t=ALF.tipo, mk=monthKey(today());
  return `<form class="card" id="alf"><h3>Nueva alerta</h3>${provOptions()}
    <div class="row" style="align-items:flex-end">
      <label class="f">Tipo<select id="alt"><option value="proveedor" ${t==='proveedor'?'selected':''}>Pago a proveedor en una semana</option><option value="tope_semanal" ${t==='tope_semanal'?'selected':''}>Tope de pagos por semana</option><option value="antiguedad" ${t==='antiguedad'?'selected':''}>Facturas viejas sin programar</option></select></label>
      ${t==='proveedor'?`<label class="f" style="flex:2 1 260px">Proveedor<input type="text" id="alp" list="provs" required placeholder="Elegí de la lista"></label>`:''}
      ${t!=='antiguedad'?`<label class="f">Monto (millones de $)<input type="text" id="alm" class="amt" required placeholder="Ej.: 30"></label>`:''}
      ${t==='proveedor'?`<label class="f">Semana del mes<select id="als">${[1,2,3,4].map(w=>`<option value="${w}">Semana ${w}</option>`).join('')}</select></label>`:''}
      ${t!=='antiguedad'?`<label class="f">Mes<input type="month" id="almes" value="${mk}"></label><label class="chk"><input type="checkbox" id="alrec"> Todos los meses</label>`:`<label class="f">Más de (días)<input type="number" id="ald" value="90" min="1" style="width:90px"></label>`}
      <label class="f" style="flex:2 1 220px">Nota<input type="text" id="aln" placeholder="Ej.: acuerdo de pago, cuota 2 de 4"></label></div>
    <div class="row" style="margin-top:10px"><button class="btn pri" type="submit">Guardar alerta</button><button class="btn" type="button" id="alx">Cancelar</button></div></form>`;
}
function bindAlertForm(){
  $('#alt').onchange=e=>{ ALF.tipo=e.target.value; viewAlertas(); };
  $('#alx').onclick=()=>{ ALF=null; viewAlertas(); };
  $('#alf').onsubmit=async ev=>{ ev.preventDefault();
    try{
      const t=ALF.tipo, rec=$('#alrec')?.checked; const o={tipo:t, nota:$('#aln').value.trim()};
      if(t!=='antiguedad'){ const v=parseAmt($('#alm').value); if(!(v>0)) throw new Error('Ingresá el monto en millones.'); o.monto=Math.round(v*1e6*100)/100; o.mes=rec?null:($('#almes').value+'-01'); }
      if(t==='proveedor'){ const p=parseProv($('#alp').value); if(!p.cprov) throw new Error('Elegí el proveedor de la lista para que la alerta pueda controlar sus pagos.'); Object.assign(o,p); o.semana=+$('#als').value; }
      if(t==='antiguedad') o.dias=+$('#ald').value||90;
      await q(sb.from('alertas').insert(o)); toast('Alerta creada'); ALF=null; await refresh();
    }catch(e){ fail(e); } };
}

/* ============ Usuarios ============ */
function viewUsuarios(){
  const ps=S.perfiles;
  main().innerHTML=`<div class="view">
    <div class="head"><div><div class="eyebrow">Administración</div><h1>Usuarios y roles</h1><p>Cada persona crea su cuenta desde “Ingresar”. Acá le asignás el rol. Los permisos se controlan en la base de datos: un rol sin permiso no puede aprobar ni cargar aunque modifique la página.</p></div></div>
    <div class="note">Director de Pagos: preselecciona, envía, carga cheques y la base. · Subsecretario de Programación Financiera: aprueba, rechaza, modifica, crea alertas y carga la base. · Subsecretario de Planificación Presupuestaria: consulta base, cheques y análisis. · Lector: solo el feed público.</div>
    <div class="tw"><table><thead><tr><th>Persona</th><th>Cargo</th><th>Solicitó</th><th>Rol</th><th>Alta</th></tr></thead><tbody>
    ${ps.map(p=>`<tr><td>${esc(p.nombre||'—')}<span class="sub">${esc(p.email)}</span></td><td>${esc(p.cargo)}</td><td>${p.rol_solicitado?`<span class="pill warn">${ROLE_SHORT[p.rol_solicitado]}</span>`:''}</td>
      <td><select data-u="${p.id}" ${p.id===S.session.user.id?'disabled':''}>${Object.keys(ROLES).map(r=>`<option value="${r}" ${p.rol===r?'selected':''}>${ROLES[r]}</option>`).join('')}</select></td><td>${fd(p.creado_at)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
  main().querySelectorAll('[data-u]').forEach(s=>s.onchange=async()=>{ try{ await q(sb.rpc('asignar_rol',{p_usuario:s.dataset.u,p_rol:s.value})); toast('Rol actualizado'); await refresh(); }catch(e){fail(e);} });
}

/* ============ Arranque ============ */
(async function boot(){
  try{ const v=localStorage.getItem('viewAs'); if(v) S.viewAs=v; }catch(e){}
  S.tab = location.hash.slice(1) || 'feed';
  const { data:{ session } } = await sb.auth.getSession();
  S.session = session; await loadPerfil(); await refresh();
  sb.auth.onAuthStateChange(async (ev, session)=>{
    if(ev==='PASSWORD_RECOVERY'){ authDialog('recover'); return; }
    if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'||ev==='USER_UPDATED'){
      if((session?.user?.id||null)===(S.session?.user?.id||null) && ev!=='USER_UPDATED') return;
      S.session=session; W=null; await loadPerfil(); await refresh();
    }
  });
})().catch(e=>{ main().innerHTML=`<div class="empty"><b>No se pudo conectar con la base de datos</b>${esc(e.message||e)}. Revisá la conexión y recargá la página.</div>`; });
</script>
