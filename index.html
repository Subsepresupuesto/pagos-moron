<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Circuito de Pagos · Morón</title>
<meta name="description" content="Programación semanal de pagos a proveedores del Municipio de Morón: preselección, aprobación y publicación.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra institucional carbón + franja roja Morón; debajo, pestañas por rol. Cada pestaña es un "extracto": resumen arriba, detalle abajo, montos en mono alineados. Bordes rectos, sin sombras salvo en lo flotante. */
:root{
  --bar:#1b1d21; --bar-fg:#f2f2ef; --bar-mute:#a6a7a2; --bar-line:#35373c;
  --bg:#f3f3f0; --panel:#ffffff; --panel2:#eeeeea; --line:#e0dfd8; --line2:#c8c7bf;
  --fg:#15161a; --fg2:#45474c; --muted:#76777b;
  --red:#c8102e; --redbg:rgba(200,16,46,.07);
  --ink:#173a6b; --inkbg:rgba(23,58,107,.08);
  --ok:#1d7a4b; --okbg:rgba(29,122,75,.10);
  --warn:#9a5c00; --warnbg:rgba(196,124,0,.12);
  --bad:#b42318; --badbg:rgba(180,35,24,.09);
  --c1:#173a6b; --c2:#c8102e; --c3:#4f86c6; --c4:#d08a1f; --c5:#2f8f6b; --c6:#8a8a84; --c7:#7b5cc4;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --panel:#1a1b1e; --panel2:#232428; --line:#2b2c30; --line2:#3c3d42;
  --fg:#efefec; --fg2:#c4c4be; --muted:#8e8f8a;
  --red:#e0405a; --redbg:rgba(224,64,90,.13);
  --ink:#7fa6dc; --inkbg:rgba(127,166,220,.13);
  --ok:#4cc38a; --okbg:rgba(76,195,138,.13);
  --warn:#e3a23b; --warnbg:rgba(227,162,59,.14);
  --bad:#f0705f; --badbg:rgba(240,112,95,.13);
  --c1:#7fa6dc; --c2:#e0405a; --c3:#3d73b8; --c4:#e3a23b; --c5:#4cc38a; --c6:#8e8f8a; --c7:#a18be0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --panel:#1a1b1e; --panel2:#232428; --line:#2b2c30; --line2:#3c3d42;
  --fg:#efefec; --fg2:#c4c4be; --muted:#8e8f8a;
  --red:#e0405a; --redbg:rgba(224,64,90,.13);
  --ink:#7fa6dc; --inkbg:rgba(127,166,220,.13);
  --ok:#4cc38a; --okbg:rgba(76,195,138,.13);
  --warn:#e3a23b; --warnbg:rgba(227,162,59,.14);
  --bad:#f0705f; --badbg:rgba(240,112,95,.13);
  --c1:#7fa6dc; --c2:#e0405a; --c3:#3d73b8; --c4:#e3a23b; --c5:#4cc38a; --c6:#8e8f8a; --c7:#a18be0;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;text-wrap:balance;margin:0}
[hidden]{display:none!important}

/* barra */
.top{background:var(--bar);color:var(--bar-fg);border-bottom:3px solid var(--red)}
.topin{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1.5px solid var(--bar-fg);font:800 14px var(--display)}
.brand b{display:block;font:700 15px var(--display);letter-spacing:.01em}
.brand span{font-size:12.5px;color:var(--bar-mute)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--bar-mute)}
.who b{color:var(--bar-fg);font-weight:600}
.rolechip{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--bar-line);padding:3px 8px;color:var(--bar-fg)}
.tbtn{background:transparent;color:var(--bar-fg);border:1px solid var(--bar-line);padding:5px 11px;font-size:13px;cursor:pointer}
.tbtn:hover{border-color:var(--bar-fg)}
.tbtn.solid{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.who select{background:var(--bar);color:var(--bar-fg);border:1px solid var(--bar-line);padding:4px 6px;font-size:12.5px}
nav.tabs{background:var(--panel);border-bottom:1px solid var(--line2);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
nav.tabs .wrap{display:flex;gap:0;overflow-x:auto;scrollbar-width:thin}
nav.tabs a{flex:none;text-decoration:none;color:var(--fg2);font:600 14px var(--display);letter-spacing:.01em;padding:12px 14px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--red)}
nav.tabs a .cnt{font:600 11px var(--mono);background:var(--red);color:#fff;padding:1px 5px;margin-left:6px;vertical-align:1px}

/* banda de alertas */
#alertband{background:var(--warnbg);border-bottom:1px solid var(--line2)}
#alertband .wrap{padding-block:8px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.al{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.al .sev{font:700 11px var(--font);letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border:1px solid currentColor;white-space:nowrap}
.sev.bad{color:var(--bad)}.sev.warn{color:var(--warn)}.sev.info{color:var(--ink)}.sev.ok{color:var(--ok)}

main{padding-block:26px 60px}
.view{display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;border-top:2px solid var(--fg);padding-top:12px}
.head h1{font-size:clamp(24px,3vw,34px);font-weight:800;line-height:1.05}
.head p{margin:4px 0 0;color:var(--fg2);max-width:72ch}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.card{background:var(--panel);border:1px solid var(--line);padding:16px 18px;min-width:0}
.card h3{font-size:16px;font-weight:700;margin-bottom:2px}
.cap{font-size:13px;color:var(--muted);margin:0 0 12px}
.empty{padding:26px 18px;text-align:center;color:var(--fg2);border:1px dashed var(--line2);background:var(--panel)}
.empty b{display:block;font-family:var(--display);font-size:16px;color:var(--fg);margin-bottom:4px}

/* KPIs tipo extracto */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:2px solid var(--ink);background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.kpi{padding:12px 16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.kpi .k{font-size:12.5px;color:var(--fg2)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.kpi .s{font-size:12px;color:var(--muted)}

/* controles */
.btn{background:var(--panel);border:1px solid var(--line2);padding:7px 13px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--fg)}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-decoration:underline;font-size:inherit}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--fg2);font-weight:600;min-width:0}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],select,textarea{background:var(--panel);border:1px solid var(--line2);padding:6px 8px;font-size:13.5px;min-width:0;max-width:100%}
textarea{width:100%;min-height:62px;resize:vertical}
input.amt{font-family:var(--mono);text-align:right;width:140px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--fg2);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line2)}
.seg button{background:transparent;border:0;border-right:1px solid var(--line2);padding:6px 11px;cursor:pointer;font-size:13px;color:var(--fg2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px;background:var(--panel2);border:1px solid var(--line)}
.filters input[type=search]{width:240px}

/* tablas tipo libro */
.tw{overflow:auto;max-width:100%}
.tw.tall{max-height:620px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;text-align:left;color:var(--fg2);background:var(--panel);border-bottom:1.5px solid var(--fg2);padding:7px 8px;white-space:nowrap;font-size:12px;position:sticky;top:0;z-index:1}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--fg)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
tbody tr:hover td{background:var(--inkbg)}
tr.sel td{background:var(--inkbg)!important}
tr.added td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
td.nw{white-space:nowrap}
tr.dim td{color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
td .sub{display:block;font-size:11.5px;color:var(--muted)}
td.prov{min-width:200px;max-width:320px}
tfoot td{font-weight:700;border-top:1.5px solid var(--fg2);border-bottom:0;background:var(--panel)!important}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border:1px solid currentColor;white-space:nowrap;margin:1px 2px 1px 0}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.ink{color:var(--ink)}.pill.mute{color:var(--muted)}
.st{display:inline-block;font:700 11px var(--font);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;color:#fff}
.st.borrador{background:var(--muted)}.st.enviada{background:var(--warn)}.st.aprobada{background:var(--ok)}.st.rechazada{background:var(--bad)}.st.descartada{background:var(--line2);color:var(--fg2)}

/* editor de programación */
.wb{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.side{position:sticky;top:60px;display:flex;flex-direction:column;gap:12px}
.ticket{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--ink);padding:14px 16px}
.ticket .big{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.lead{display:flex;align-items:baseline;gap:6px;font-size:13px;padding:3px 0}
.lead span:first-child{color:var(--fg2)}
.lead i{flex:1;border-bottom:1px dotted var(--line2);transform:translateY(-3px)}
.lead span:last-child{font-family:var(--mono)}
.mini h4{margin:10px 0 4px;font:700 12px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--panel2);margin-top:2px}
.bar i{display:block;height:100%;background:var(--ink)}
.note{font-size:13px;padding:9px 12px;border-left:3px solid var(--ink);background:var(--inkbg)}
.note.bad{border-color:var(--bad);background:var(--badbg)}
.note.warn{border-color:var(--warn);background:var(--warnbg)}
.note.ok{border-color:var(--ok);background:var(--okbg)}

/* feed */
.feed{display:flex;flex-direction:column;gap:14px}
.fc{display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);position:relative}
.fdate{background:var(--bar);color:var(--bar-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 6px;text-align:center}
.fdate b{font:800 34px/1 var(--display)}
.fdate span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--bar-mute)}
.fdate em{font-style:normal;font-size:11px;margin-top:6px;color:var(--bar-fg);border-top:1px solid var(--bar-line);padding-top:4px}
.fbody{padding:14px 18px;min-width:0;display:flex;flex-direction:column;gap:8px}
.fhead{display:flex;gap:10px 24px;align-items:baseline;flex-wrap:wrap}
.fhead h3{font-size:18px}
.ftotal{font:600 24px var(--mono);letter-spacing:-.02em;margin-left:auto}
.fmeta{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--fg2)}
.stamp{position:absolute;top:10px;right:14px;font:800 11px var(--display);letter-spacing:.14em;color:var(--ok);border:2px solid var(--ok);padding:2px 8px;transform:rotate(-4deg);opacity:.85;pointer-events:none}
.fc .fhead{padding-right:96px}
.provlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 18px}
.provlist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line2);padding:3px 0;font-size:13px;min-width:0}
.provlist div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.provlist div span:last-child{white-space:nowrap;flex:none}
.mini .num{white-space:nowrap}
mark{background:var(--warnbg);color:inherit;padding:0 2px}

/* gráficos */
.chart{position:relative;height:340px}
.chart.sm{height:260px}
.lgd{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--fg2);margin:6px 0}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:12px;height:12px;display:inline-block}

/* modal y toast */
.modal{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:60;display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border-top:4px solid var(--red);width:min(460px,100%);max-height:92vh;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dlg.wide{width:min(860px,100%)}
.dlg h2{font-size:22px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:10px 16px;font-size:13.5px;max-width:min(560px,92vw);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.err{background:var(--bad);color:#fff}

footer{background:var(--bar);color:var(--bar-mute);font-size:12.5px}
footer .wrap{padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer b{color:var(--bar-fg)}

@media (max-width:1000px){.wb{grid-template-columns:minmax(0,1fr)}.side{position:static}.s8,.s7,.s6,.s5,.s4,.s3{grid-column:span 12}}
@media (max-width:560px){.fc{grid-template-columns:minmax(0,1fr)}.fdate{flex-direction:row;gap:10px;justify-content:flex-start;padding:8px 14px}.fdate b{font-size:24px}.fdate em{border:0;margin:0;padding:0}.ftotal{margin-left:0}.fc .fhead{padding-right:0}.stamp{top:8px}.filters input[type=search]{width:100%}.who{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap topin">
    <div class="brand"><div class="mark" aria-hidden="true">M</div><div><b>Circuito de Pagos</b><span>Municipio de Morón · Secretaría de Economía y Finanzas</span></div></div>
    <div class="who" id="who"></div>
  </div>
</header>
<nav class="tabs" aria-label="Secciones"><div class="wrap" id="tabs"></div></nav>
<div id="alertband" hidden><div class="wrap" id="alertlist"></div></div>
<main class="wrap" id="main"><div class="empty"><b>Cargando…</b>Conectando con la base de datos.</div></main>
<footer><div class="wrap"><div><b>Circuito de Pagos</b> · Municipio de Morón</div><div>Los montos publicados corresponden a programaciones aprobadas. Los cheques diferidos no se publican en este feed.</div></div></footer>
<div id="modal" class="modal" hidden></div>
<div id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* ============ Configuración ============ */
const CFG = {
  url: 'https://zbvsapqualjbaqqhourk.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpidnNhcHF1YWxqYmFxcWhvdXJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0Mjg3OTgsImV4cCI6MjEwODAwNDc5OH0.2m85Der20EPwtSsg4lGiBf8Rv8Fzu_TQwwLlbQgYLkQ',
  xlsxLib: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
};
const sb = (window.__mockSupabase || window.supabase).createClient(CFG.url, CFG.key);

/* ============ Utilidades ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf2 = new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1});
const money = v => '$ ' + nf2.format(+v||0);
const mm = v => { v=+v||0; return Math.abs(v)>=1e9 ? '$ '+nf2.format(v/1e9)+' mil M' : '$ '+nf1.format(v/1e6)+' M'; };
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const pd = iso => { if(!iso) return null; const [y,m,d]=String(iso).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); };
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd = s => { const d=pd(s); return d? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear() : '—'; };
const fdt = s => { if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); };
const today = () => iso(new Date());
const wom = s => { const d=pd(s).getDate(); return d<=7?1:d<=14?2:d<=21?3:4; };
const womRange = (y,m,w) => { const last=new Date(y,m+1,0).getDate(); const a=[1,8,15,22][w-1]; const b=w===4?last:a+6; return [new Date(y,m,a), new Date(y,m,b)]; };
const monthKey = s => String(s).slice(0,7);
const monthName = k => { const [y,m]=k.split('-').map(Number); return MES[m-1]+' '+y; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const sum = (a,f=x=>x) => a.reduce((s,x)=>s+(+f(x)||0),0);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ROLES = { lector:'Lector', director:'Director de Pagos', subprog:'Subsecretario de Programación Financiera', subplan:'Subsecretario de Planificación Presupuestaria', admin:'Administrador' };
const ROLE_SHORT = { lector:'Lector', director:'Dir. de Pagos', subprog:'Subs. Prog. Financiera', subplan:'Subs. Planificación', admin:'Administrador' };
const ESTADOS = { borrador:'Borrador', enviada:'En revisión', aprobada:'Aprobada', rechazada:'Rechazada', descartada:'Descartada' };

function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, err?7000:3500); }
function fail(e){ console.error(e); toast((e && (e.message||e.error_description)) || 'Ocurrió un error. Probá de nuevo.', true); }
async function q(p){ const {data,error}=await p; if(error) throw error; return data; }
async function all(build){ const out=[]; for(let from=0;;from+=1000){ const rows=await q(build().range(from,from+999)); out.push(...rows); if(rows.length<1000) break; } return out; }
function download(name, blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500); }
function csv(rows){ return '﻿'+rows.map(r=>r.map(v=>{ if(typeof v==='number') return String(v).replace('.',','); const s=String(v??''); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\r\n'); }
let _xlsx; function loadXlsx(){ if(window.XLSX) return Promise.resolve(window.XLSX); return _xlsx ||= new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=CFG.xlsxLib; s.onload=()=>res(window.XLSX); s.onerror=()=>rej(new Error('No se pudo cargar el lector de Excel')); document.head.appendChild(s); }); }

/* ============ Estado ============ */
const S = {
  session:null, perfil:null, viewAs:null,
  carga:null, fact:[], factByKey:new Map(),
  progs:[], items:[], itemsByProg:new Map(),
  cheques:[], esquemas:[], alertas:[], perfiles:[],
  feed:[], feedItems:new Map(),
  tab:'feed', loaded:false
};
function realRole(){ return S.perfil?.rol || 'lector'; }
function role(){ return realRole()==='admin' ? (S.viewAs||'admin') : realRole(); }
function is(...r){ const x=role(); return x==='admin' || r.includes(x); }
const internal = () => is('director','subprog','subplan');

const TABS = [
  {id:'feed', t:'Pagos aprobados', ok:()=>true},
  {id:'presel', t:'Preselección', ok:()=>is('director')},
  {id:'revision', t:'Aprobación', ok:()=>is('subprog')},
  {id:'cheques', t:'Cheques diferidos', ok:()=>internal()},
  {id:'base', t:'Base de facturas', ok:()=>internal()},
  {id:'analisis', t:'Análisis y previsión', ok:()=>is('subprog','subplan')},
  {id:'alertas', t:'Alertas', ok:()=>is('director','subprog')},
  {id:'usuarios', t:'Usuarios', ok:()=>realRole()==='admin' && role()==='admin'}
];

/* ============ Carga de datos ============ */
async function loadFeed(){
  S.feed = await q(sb.from('v_feed_pagos').select('*').order('fecha_pago',{ascending:false}));
}
async function loadFeedItems(id){
  if(S.feedItems.has(id)) return S.feedItems.get(id);
  const it = await all(()=>sb.from('programacion_items').select('clave,cprov,proveedor,dependencia,ff,oc,expediente,comprobante,f_factura,importe,monto,nota').eq('programacion_id',id).eq('vigente',true).order('proveedor'));
  S.feedItems.set(id,it); return it;
}
async function loadInternal(){
  if(!internal()) return;
  const [cargas, fact, progs, items, cheques, esquemas, alertas] = await Promise.all([
    q(sb.from('base_cargas').select('*').eq('activa',true)),
    all(()=>sb.from('v_facturas_pendientes').select('*').order('proveedor').order('comprobante')),
    q(sb.from('programaciones').select('*').neq('estado','descartada').order('fecha_pago',{ascending:false})),
    all(()=>sb.from('programacion_items').select('*').eq('vigente',true).order('id')),
    all(()=>sb.from('cheques').select('*').order('f_vencimiento')),
    q(sb.from('cheque_esquemas').select('*').order('id',{ascending:false})),
    q(sb.from('alertas').select('*').order('id',{ascending:false})),
  ]);
  S.carga = cargas[0] || null;
  S.fact = fact.map(r=>({...r, saldo:+r.saldo, importe:+r.importe, pagado:+r.pagado, pendiente:+r.pendiente, en_curso:+r.en_curso, pagado_portal:+r.pagado_portal}));
  S.factByKey = new Map(S.fact.map(r=>[r.clave,r]));
  S.progs = progs; S.items = items.map(i=>({...i, monto:+i.monto, importe:+i.importe}));
  S.itemsByProg = new Map(); for(const i of S.items){ if(!S.itemsByProg.has(i.programacion_id)) S.itemsByProg.set(i.programacion_id,[]); S.itemsByProg.get(i.programacion_id).push(i); }
  S.cheques = cheques.map(c=>({...c, monto:+c.monto})); S.esquemas = esquemas; S.alertas = alertas.map(a=>({...a, monto:a.monto==null?null:+a.monto}));
  if(realRole()==='admin') S.perfiles = await q(sb.from('perfiles').select('*').order('creado_at'));
}
async function refresh(){
  try{ await Promise.all([loadFeed(), loadInternal()]); S.loaded=true; render(); }
  catch(e){ fail(e); }
}
const progTotal = id => sum(S.itemsByProg.get(id)||[], i=>i.monto);
const progById = id => S.progs.find(p=>p.id===id);

/* ============ Sesión ============ */
async function loadPerfil(){
  S.perfil = null;
  if(!S.session) return;
  const r = await sb.from('perfiles').select('*').eq('id', S.session.user.id).maybeSingle();
  S.perfil = r.data || {rol:'lector', email:S.session.user.email, nombre:''};
}
function renderWho(){
  const el=$('#who');
  if(!S.session){ el.innerHTML=`<span>Consulta pública</span><button class="tbtn solid" id="btnLogin">Ingresar</button>`; $('#btnLogin').onclick=()=>authDialog('in'); return; }
  const p=S.perfil||{};

function authDialog(mode, extra){
  const m=$('#modal'); m.hidden=false;
  const signup = mode==='up', reset = mode==='reset', recov = mode==='recover';
  m.innerHTML = `<form class="dlg" id="authf">
    <div class="eyebrow">Circuito de Pagos</div>
    <h2>${recov?'Nueva contraseña':reset?'Recuperar contraseña':signup?'Crear cuenta':'Ingresar'}</h2>
    ${signup?`<p class="cap">Las cuentas nuevas entran como lectoras. El administrador asigna el rol de trabajo.</p>
      <label class="f">Nombre y apellido<input type="text" id="aNombre" required></label>
      <label class="f">Cargo<input type="text" id="aCargo" placeholder="Ej.: Director de Pagos"></label>
      <label class="f">Rol que solicitás<select id="aRol"><option value="">Solo consulta</option><option value="director">Director de Pagos</option><option value="subprog">Subsecretario de Programación Financiera</option><option value="subplan">Subsecretario de Planificación Presupuestaria</option></select></label>`:''}
    ${recov?'':`<label class="f">Correo<input type="email" id="aMail" required autocomplete="email"></label>`}
    ${reset?'':`<label class="f">${recov?'Contraseña nueva':'Contraseña'}<input type="password" id="aPass" required minlength="8" autocomplete="${signup||recov?'new-password':'current-password'}"></label>`}
    <div id="aMsg" class="note" hidden></div>
    <div class="row"><button class="btn pri" type="submit">${recov?'Guardar contraseña':reset?'Enviar enlace':signup?'Crear cuenta':'Ingresar'}</button><span class="sp"></span><button class="btn" type="button" id="aClose">Cerrar</button></div>
    ${recov?'':`<div class="row" style="font-size:13px">${mode==='in'?`<button class="link" type="button" data-m="up">Crear cuenta</button><button class="link" type="button" data-m="reset">Olvidé mi contraseña</button>`:`<button class="link" type="button" data-m="in">Ya tengo cuenta</button>`}</div>`}
  </form>`;
  $('#aClose').onclick=()=>{m.hidden=true; m.innerHTML='';};
  m.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>authDialog(b.dataset.m));
  $('#authf').onsubmit=async ev=>{
    ev.preventDefault(); const msg=$('#aMsg'); msg.hidden=true;
    const show=(t,cls='')=>{ msg.className='note '+cls; msg.textContent=t; msg.hidden=false; };
    try{
      if(recov){ await q(sb.auth.updateUser({password:$('#aPass').value})); m.hidden=true; toast('Contraseña actualizada'); return; }
      const email=$('#aMail').value.trim();
      if(reset){ await q(sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname})); show('Te enviamos un enlace para elegir una contraseña nueva.','ok'); return; }
      if(signup){
        const d = await q(sb.auth.signUp({email, password:$('#aPass').value, options:{emailRedirectTo:location.origin+location.pathname, data:{nombre:$('#aNombre').value.trim(), cargo:$('#aCargo').value.trim(), rol_solicitado:$('#aRol').value}}}));
        if(!d.session){ show('Cuenta creada. Confirmá tu correo con el enlace que te enviamos y después ingresá.','ok'); return; }
      } else {
        await q(sb.auth.signInWithPassword({email, password:$('#aPass').value}));
      }
      m.hidden=true; m.innerHTML='';
    }catch(e){ show(e.message==='Invalid login credentials'?'El correo o la contraseña no coinciden.':e.message,'bad'); }
  };
}

/* ============ Render general ============ */
function render(){
  renderWho();
  const tabs = TABS.filter(t=>t.ok());
  if(!tabs.find(t=>t.id===S.tab)) S.tab='feed';
  const pend = S.progs.filter(p=>p.estado==='enviada').length;
  const rech = S.progs.filter(p=>p.estado==='rechazada').length;
  $('#tabs').innerHTML = tabs.map(t=>{
    let c=''; if(t.id==='revision'&&pend) c=`<span class="cnt">${pend}</span>`; if(t.id==='presel'&&rech) c=`<span class="cnt">${rech}</span>`;
    return `<a href="#${t.id}" ${S.tab===t.id?'aria-current="page"':''}>${t.t}${c}</a>`;
  }).join('');
  renderAlertBand();
  destroyCharts();
  const fn = {feed:viewFeed, presel:viewPresel, revision:viewRevision, cheques:viewCheques, base:viewBase, analisis:viewAnalisis, alertas:viewAlertas, usuarios:viewUsuarios}[S.tab];
  fn();
}

const main = () => $('#main');
let CHARTS=[]; function destroyCharts(){ CHARTS.forEach(c=>c.destroy()); CHARTS=[]; }

/* ============ Feed público ============ */
let FEEDF={mes:'', q:''}; const OPEN=new Set();
function viewFeed(){
  const now=today(), mk=monthKey(now), yk=now.slice(0,4);
  const mesTot=sum(S.feed.filter(p=>monthKey(p.fecha_pago)===mk),p=>p.total);
  const anioTot=sum(S.feed.filter(p=>String(p.fecha_pago).startsWith(yk)),p=>p.total);
  const meses=[...new Set(S.feed.map(p=>monthKey(p.fecha_pago)))];
  let list=S.feed.filter(p=>!FEEDF.mes||monthKey(p.fecha_pago)===FEEDF.mes);
  const ql=FEEDF.q.trim().toLowerCase();
  main().innerHTML = `<div class="view">
    <div class="head"><div><div class="eyebrow">Transparencia fiscal</div><h1>Pagos a proveedores aprobados</h1>
      <p>Cada semana la Dirección de Pagos preselecciona facturas y la Subsecretaría de Programación Financiera aprueba la programación. Acá se publica cada pago aprobado, con el detalle por proveedor y por comprobante.</p></div></div>
    <div class="kpis">
      <div class="kpi"><div class="k">Pagado en ${MES[+mk.slice(5)-1]}</div><div class="v">${mm(mesTot)}</div><div class="s">${S.feed.filter(p=>monthKey(p.fecha_pago)===mk).length} programaciones</div></div>
      <div class="kpi"><div class="k">Pagado en ${yk}</div><div class="v">${mm(anioTot)}</div><div class="s">desde la primera programación publicada</div></div>
      <div class="kpi"><div class="k">Programaciones publicadas</div><div class="v">${S.feed.length}</div><div class="s">${S.feed[0]?'última: '+fd(S.feed[0].fecha_pago):'sin publicaciones'}</div></div>
      <div class="kpi"><div class="k">Facturas pagadas</div><div class="v">${nf0.format(sum(S.feed,p=>p.facturas))}</div><div class="s">en todas las programaciones</div></div>
    </div>
    ${roleRequestNote()}
    <div class="filters">
      <label class="f">Buscar proveedor o comprobante<input type="search" id="fq" value="${esc(FEEDF.q)}" placeholder="Ej.: Ciudad Hospitalaria"></label>
      <label class="f">Mes<select id="fmes"><option value="">Todos</option>${meses.map(k=>`<option value="${k}" ${FEEDF.mes===k?'selected':''}>${monthName(k)}</option>`).join('')}</select></label>
      <span class="sp"></span><span class="cap" id="fqres" style="margin:0"></span>
    </div>
    <div class="feed" id="feedlist">${list.length?'':`<div class="empty"><b>Todavía no hay pagos publicados</b>Cuando se apruebe la primera programación va a aparecer acá.</div>`}</div>
  </div>`;
  $('#fq').oninput=e=>{ FEEDF.q=e.target.value; clearTimeout(viewFeed._t); viewFeed._t=setTimeout(()=>{ const pos=e.target.selectionStart; viewFeed(); const i=$('#fq'); i.focus(); i.setSelectionRange(pos,pos); }, 300); };
  $('#fmes').onchange=e=>{ FEEDF.mes=e.target.value; viewFeed(); };
  const box=$('#feedlist');
  (async()=>{
    if(ql){ await Promise.all(list.map(p=>loadFeedItems(p.id))); }
    let found=0, foundAmt=0;
    for(const p of list){
      let its = S.feedItems.get(p.id);
      let match=null;
      if(ql){ match=its.filter(i=>(i.proveedor||'').toLowerCase().includes(ql)||(i.comprobante||'').includes(ql)||String(i.cprov)===ql); if(!match.length) continue; found+=match.length; foundAmt+=sum(match,i=>i.monto); }
      box.insertAdjacentHTML('beforeend', feedCard(p, match));
    }
    if(ql) $('#fqres').textContent = found? `${found} facturas coinciden · ${money(foundAmt)}` : 'Sin coincidencias';
    if(ql && !found) box.innerHTML=`<div class="empty"><b>Sin pagos para “${esc(FEEDF.q)}”</b>Probá con otra parte del nombre o con el número de comprobante.</div>`;
    box.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{ const id=+b.dataset.open; OPEN.has(id)?OPEN.delete(id):OPEN.add(id); await loadFeedItems(id); viewFeed(); });
    box.querySelectorAll('[data-csv]').forEach(b=>b.onclick=()=>exportProg(+b.dataset.csv,'csv'));
    box.querySelectorAll('[data-xls]').forEach(b=>b.onclick=()=>exportProg(+b.dataset.xls,'xlsx'));
    for(const id of OPEN) if(!S.feedItems.has(id)) { await loadFeedItems(id); viewFeed(); break; }
  })().catch(fail);
}
function feedCard(p, match){
  const d=pd(p.fecha_pago), its=S.feedItems.get(p.id), open=OPEN.has(p.id);
  const changed = p.facturas_preseleccion && (Math.abs(p.total_preseleccion-p.total)>0.5 || p.facturas_preseleccion!==p.facturas);
  let detail='';
  if(open && its){
    const byP=new Map(); for(const i of its){ const k=i.cprov; if(!byP.has(k)) byP.set(k,{n:i.proveedor,t:0,c:0}); byP.get(k).t+=+i.monto; byP.get(k).c++; }
    const provs=[...byP.values()].sort((a,b)=>b.t-a.t);
    detail = `<div class="mini"><h4>Por proveedor</h4><div class="provlist">${provs.map(x=>`<div><span title="${esc(x.n)}">${esc(x.n)} <span class="cap">(${x.c})</span></span><span class="num">${money(x.t)}</span></div>`).join('')}</div>
      <h4>Comprobantes</h4><div class="tw tall"><table><thead><tr><th>Proveedor</th><th>Dependencia</th><th>Comprobante</th><th class="c">FF</th><th>F. factura</th><th class="n">Importe</th><th class="n">Pagado</th></tr></thead>
      <tbody>${its.map(i=>`<tr><td class="prov">${esc(i.proveedor)}<span class="sub">C.Prov ${i.cprov}</span></td><td>${esc(i.dependencia)}</td><td class="num">${esc(i.comprobante)}<span class="sub">Exp. ${i.expediente??'—'} · OC ${i.oc??'—'}</span></td><td class="c">${i.ff??''}</td><td>${fd(i.f_factura)}</td><td class="n">${money(i.importe)}</td><td class="n">${money(i.monto)}${+i.monto < +i.importe-0.5?'<span class="sub">pago parcial</span>':''}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="6">Total</td><td class="n">${money(p.total)}</td></tr></tfoot></table></div></div>`;
  }
  const hl = match ? `<div class="note warn">${match.length} ${match.length===1?'factura coincide':'facturas coinciden'} con la búsqueda: <b class="num">${money(sum(match,i=>i.monto))}</b> · ${esc([...new Set(match.map(i=>i.proveedor))].slice(0,3).join(', '))}</div>` : '';
  return `<article class="fc"><div class="fdate"><b>${d.getDate()}</b><span>${MESC[d.getMonth()]} ${d.getFullYear()}</span><em>Semana ${wom(p.fecha_pago)}</em></div>
    <div class="fbody"><span class="stamp">APROBADA</span>
      <div class="fhead"><h3>${esc(p.titulo||'Pago '+fd(p.fecha_pago))}</h3><span class="ftotal">${money(p.total)}</span></div>
      <div class="fmeta"><span><b>${p.facturas}</b> facturas</span><span><b>${p.proveedores}</b> proveedores</span><span>${p.origen==='importado'?'Importada de planilla':'Aprobada el '+fdt(p.revisado_at)}</span>
        ${changed?`<span class="pill ink">Ajustada en la aprobación: preselección ${mm(p.total_preseleccion)} (${p.facturas_preseleccion})</span>`:''}</div>
      ${p.observacion?`<div class="cap" style="margin:0">Observación: ${esc(p.observacion)}</div>`:''}
      ${hl}
      <div class="row"><button class="btn sm" data-open="${p.id}">${open?'Ocultar detalle':'Ver detalle'}</button><button class="btn sm" data-csv="${p.id}">Descargar CSV</button><button class="btn sm" data-xls="${p.id}">Descargar Excel</button></div>
      ${detail}
    </div></article>`;
}
async function exportProg(id, fmt){
  try{
    const p = S.feed.find(x=>x.id===id) || progById(id);
    const its = S.feed.find(x=>x.id===id) ? await loadFeedItems(id) : (S.itemsByProg.get(id)||[]);
    const head=['Fecha de pago','C.PROV','PROVEEDOR','DEP.DESC','FF','OC. NRO','EXPED.','COMPROBANTE','F.Factura','IMPORTE','A PAGAR','Nota'];
    const rows=its.map(i=>[fd(p.fecha_pago),i.cprov,i.proveedor,i.dependencia,i.ff,i.oc,i.expediente,i.comprobante,fd(i.f_factura),+i.importe,+i.monto,i.nota||'']);
    const name=`A_pagar_${p.fecha_pago}`;
    if(fmt==='csv'){ download(name+'.csv', new Blob([csv([head,...rows])],{type:'text/csv;charset=utf-8'})); return; }
    const X=await loadXlsx(); const ws=X.utils.aoa_to_sheet([head,...rows, [], ['','','TOTAL','','','','','','','',sum(its,i=>i.monto)]]);
    ws['!cols']=[{wch:12},{wch:8},{wch:36},{wch:40},{wch:5},{wch:8},{wch:8},{wch:15},{wch:11},{wch:15},{wch:15},{wch:16}];
    const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,'A pagar'); X.writeFile(wb, name+'.xlsx');
  }catch(e){ fail(e); }
}
function roleRequestNote(){
  if(!S.session) return `<div class="note">¿Trabajás en el circuito de pagos? <button class="link" onclick="authDialog('in')">Ingresá</button> con tu cuenta para preseleccionar, aprobar o analizar.</div>`;
  if(realRole()==='lector'){
    const sol=S.perfil?.rol_solicitado;
    return `<div class="note">Tu cuenta es de consulta. ${sol?`Pediste el rol <b>${esc(ROLES[sol])}</b>; el administrador tiene que habilitarlo.`:'Si necesitás un rol de trabajo, pedíselo al administrador del portal.'}</div>`;
  }
  return '';
}

/* ============ Editor de programación (preselección y revisión) ============ */
let W=null;
function openWB(p, mode){
  const its = p ? (S.itemsByProg.get(p.id)||[]) : [];
  W = { id:p?.id||null, estado:p?.estado||'borrador', mode, fecha:p?.fecha_pago||nextPayDay(), titulo:p?.titulo||'', nota:p?.nota||'', obs:p?.observacion||'',
        items:new Map(its.map(i=>[i.clave,{...i}])), saved:new Map(its.map(i=>[i.clave,+i.monto])),
        pres:new Map((p?.preseleccion||[]).map(x=>[x.clave,x])), dirty:false,
        f:{q:'',dep:'',ff:'',val:'',edad:'',desde:'',hasta:'',solo:true,ocultar:true,selOnly:false}, sort:{k:'f_factura',d:1}, lim:150, conf:null };
  if(!p) W.titulo = 'Pago '+fd(W.fecha).slice(0,5);
}
function nextPayDay(){ const d=new Date(); for(let i=1;i<8;i++){ const x=addDays(d,i); if(x.getDay()>=1&&x.getDay()<=5) return iso(x); } return today(); }
const editable = () => W && ((W.mode==='director' && ['borrador','rechazada'].includes(W.estado)) || (W.mode==='subprog' && W.estado==='enviada'));
function enOtras(r){ return Math.max(0, r.en_curso - (W.saved.get(r.clave)||0)); }
function disponible(r){ return Math.max(0, r.pendiente - enOtras(r)); }
function filtered(){
  const f=W.f, ql=f.q.trim().toLowerCase(), now=new Date();
  let rows = S.fact.filter(r=>{
    if(f.selOnly && !W.items.has(r.clave)) return false;
    if(ql && !(r.proveedor.toLowerCase().includes(ql) || r.comprobante.includes(ql) || String(r.cprov)===ql || String(r.expediente)===ql)) return false;
    if(f.dep && r.dependencia!==f.dep) return false;
    if(f.ff && String(r.ff)!==f.ff) return false;
    if(f.val && String(!!r.validada)!==f.val) return false;
    if(f.edad && !(r.dias>=+f.edad)) return false;
    if(f.desde && r.f_factura<f.desde) return false;
    if(f.hasta && r.f_factura>f.hasta) return false;
    if(f.solo && r.pendiente<=0 && !W.items.has(r.clave)) return false;
    if(f.ocultar && enOtras(r)>0 && disponible(r)<=0 && !W.items.has(r.clave)) return false;
    return true;
  });
  const {k,d}=W.sort;
  rows.sort((a,b)=>{ let x=a[k],y=b[k]; if(k==='sel'){x=W.items.has(a.clave)?1:0;y=W.items.has(b.clave)?1:0;} if(typeof x==='string'||typeof y==='string') return d*String(x??'').localeCompare(String(y??''),'es'); return d*((x??0)-(y??0)); });
  return rows;
}
function itemFrom(r, monto){ return {clave:r.clave,cprov:r.cprov,proveedor:r.proveedor,dependencia:r.dependencia,ff:r.ff,oc:r.oc,expediente:r.expediente,comprobante:r.comprobante,f_factura:r.f_factura,importe:r.importe,monto:Math.round(monto*100)/100,nota:''}; }
function toggle(clave, on){
  const r=S.factByKey.get(clave);
  if(on){ if(!r) return; const m=disponible(r); if(m<=0){ toast('Esa factura no tiene saldo disponible para programar.',true); return; } W.items.set(clave,itemFrom(r,m)); }
  else W.items.delete(clave);
  W.dirty=true;
}

function wbRow(r, ed){
  const it=W.items.get(r.clave), on=!!it, disp=disponible(r), otras=enOtras(r);
  const pills=[];
  if(r.validada===false) pills.push('<span class="pill mute">No validada</span>');
  if(r.pagado_portal>0) pills.push(`<span class="pill ok" title="${esc(r.pagos_portal||'')}">Pagada ${r.pendiente>0?'parcial':''} ${fd(r.ultimo_pago).slice(0,5)}</span>`);
  if(otras>0) pills.push(`<span class="pill warn" title="Programaciones ${esc((r.progs_en_curso||[]).filter(x=>x!==W.id).join(', '))}">En otra programación ${mm(otras)}</span>`);
  if(r.dias>60) pills.push(`<span class="pill bad">+60 días</span>`);
  if(W.mode==='subprog' && on && W.pres.size && !W.pres.has(r.clave)) pills.push('<span class="pill ok">Agregada en revisión</span>');
  return `<tr class="${on?'sel':''} ${W.mode==='subprog'&&on&&W.pres.size&&!W.pres.has(r.clave)?'added':''} ${disp<=0&&!on?'dim':''}">
    <td class="c"><input type="checkbox" data-k="${esc(r.clave)}" ${on?'checked':''} ${!ed||(disp<=0&&!on)?'disabled':''} aria-label="Tildar ${esc(r.comprobante)}"></td>
    <td class="prov">${esc(r.proveedor)}<span class="sub">C.Prov ${r.cprov} · ${esc(r.dependencia||'')}</span></td>
    <td class="num nw">${esc(r.comprobante)}<span class="sub">Exp. ${r.expediente??'—'} · OC ${r.oc??'—'}</span></td>
    <td class="c">${r.ff??''}</td><td class="nw">${fd(r.f_factura)}<span class="sub">${r.dias??'—'} días</span></td>
    <td class="n">${money(r.pendiente)}${Math.abs(r.saldo-r.pendiente)>0.5?`<span class="sub">base ${money(r.saldo)}</span>`:''}</td><td>${pills.join('')}</td>
    <td class="n">${on? (ed?`<input class="amt" data-m="${esc(r.clave)}" value="${nf2.format(it.monto)}" aria-label="Monto a pagar">`:money(it.monto)) : '<span class="cap">—</span>'}${on&&it.monto>disp+0.5?'<span class="sub" style="color:var(--bad)">supera lo disponible</span>':''}</td></tr>`;
}

  // ítems que no están en la base activa y quitados respecto de la preselección
  const out=[...W.items.values()].filter(i=>!S.factByKey.has(i.clave));
  const quit=W.mode==='subprog'?[...W.pres.values()].filter(x=>!W.items.has(x.clave)):[];
  let h='';
  if(out.length) h+=`<div class="card"><h3>Facturas fuera de la base actual (${out.length})</h3><p class="cap">Están en la programación pero no figuran en la última base cargada.</p>
    <div class="tw"><table><tbody>${out.map(i=>`<tr><td class="prov">${esc(i.proveedor)}</td><td class="num">${esc(i.comprobante)}</td><td class="n">${money(i.monto)}</td><td>${editable()?`<button class="btn sm" data-rm="${esc(i.clave)}">Quitar</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(quit.length) h+=`<div class="card"><h3>Quitadas de la preselección (${quit.length})</h3><p class="cap">El Director las había incluido. Si las volvés a tildar, vuelven con el monto original.</p>

  return h;
}

      ${!conf && ed && W.mode==='subprog'?`<button class="btn" id="wSave" ${!W.dirty?'disabled':''}>Guardar cambios</button><button class="btn ok" id="wApr" ${!its.length?'disabled':''}>Aprobar…</button><button class="btn bad" id="wRech">Rechazar…</button>`:''}

      ${W.id?`<button class="btn sm" id="wXls">Descargar Excel de facturas</button><button class="link" id="wHist">Ver historial</button>`:''}

function bindWB(ed){
  const r=()=>viewWB(), keep=(id,fn)=>{ const e=$(id); if(e) e.oninput=e.onchange=fn; };
  $('#wbBack').onclick=()=>{ if(W.dirty && !confirmLeave()) return; W=null; render(); };
  const fl=(k,v)=>{ W.f[k]=v; W.lim=150; r(); };
  $('#wq').oninput=e=>{ W.f.q=e.target.value; clearTimeout(bindWB._t); bindWB._t=setTimeout(()=>{ const p=e.target.selectionStart; fl('q',W.f.q); const i=$('#wq'); i.focus(); i.setSelectionRange(p,p); },250); };
  $('#wdep').onchange=e=>fl('dep',e.target.value); $('#wff').onchange=e=>fl('ff',e.target.value); $('#wval').onchange=e=>fl('val',e.target.value);
  $('#wedad').onchange=e=>fl('edad',e.target.value); $('#wdesde').onchange=e=>fl('desde',e.target.value); $('#whasta').onchange=e=>fl('hasta',e.target.value);
  $('#wsolo').onchange=e=>fl('solo',e.target.checked); $('#wocu').onchange=e=>fl('ocultar',e.target.checked); $('#wsel').onchange=e=>fl('selOnly',e.target.checked);
  document.querySelectorAll('#wtab th[data-s]').forEach(th=>th.onclick=()=>{ const k=th.dataset.s; W.sort = W.sort.k===k?{k,d:-W.sort.d}:{k,d:k==='dias'||k==='saldo'||k==='pendiente'?-1:1}; r(); });
  const more=$('#wMore'); if(more) more.onclick=()=>{ W.lim+=150; r(); };
  const all=$('#wAll'); if(all) all.onclick=()=>{ const rows=filtered(); const allSel=rows.every(x=>W.items.has(x.clave)||disponible(x)<=0); for(const x of rows){ if(allSel) W.items.delete(x.clave); else if(!W.items.has(x.clave) && disponible(x)>0) W.items.set(x.clave,itemFrom(x,disponible(x))); } W.dirty=true; r(); };
  $('#wtab').addEventListener('change',e=>{
    const k=e.target.dataset.k; if(k){ toggle(k,e.target.checked); r(); return; }
    const mk=e.target.dataset.m; if(mk){ const v=parseAmt(e.target.value); const it=W.items.get(mk); if(!it) return; if(!(v>0)){ toast('El monto tiene que ser mayor a cero.',true); r(); return; } it.monto=Math.round(v*100)/100; W.dirty=true; r(); }
  });
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ W.items.delete(b.dataset.rm); W.dirty=true; r(); });
  document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{ const x=W.pres.get(b.dataset.restore); const base=S.factByKey.get(x.clave); W.items.set(x.clave, base?itemFrom(base,+x.monto):{...x,monto:+x.monto}); W.dirty=true; r(); });
  keep('#wfecha',e=>{ if(e.type!=='change') return; W.fecha=e.target.value||W.fecha; W.dirty=true; r(); });
  keep('#wtit',e=>{ W.titulo=e.target.value; W.dirty=true; });
  keep('#wnota',e=>{ W.nota=e.target.value; W.dirty=true; });
  const on=(id,fn)=>{ const b=$(id); if(b) b.onclick=fn; };
  on('#wSave',()=>wbSave().then(ok=>ok&&toast('Guardado')));
  on('#wSend',async()=>{ const id=await wbSave(); if(!id) return; try{ await q(sb.rpc('enviar_programacion',{p_id:id})); toast('Enviada a aprobación'); W=null; await refresh(); }catch(e){fail(e);} });
  on('#wDesc',()=>{ W.conf='descartar'; r(); });
  on('#wDescOk',async()=>{ try{ await q(sb.rpc('descartar_programacion',{p_id:W.id})); toast('Programación descartada'); W=null; await refresh(); }catch(e){fail(e);} });
  on('#wApr',()=>{ W.conf='aprobar'; r(); });
  on('#wRech',()=>{ W.conf='rechazar'; r(); });
  on('#wCancel',()=>{ W.conf=null; r(); });
  on('#wAprOk',async()=>{ const obs=$('#wobs').value.trim(); if(W.dirty && !(await wbSave())) return; try{ await q(sb.rpc('aprobar_programacion',{p_id:W.id,p_observacion:obs})); toast('Aprobada y publicada'); W=null; S.feedItems.clear(); await refresh(); }catch(e){fail(e);} });
  on('#wRechOk',async()=>{ const obs=$('#wobs').value.trim(); if(!obs){ toast('Escribí el motivo del rechazo.',true); return; } if(W.dirty && !(await wbSave())) return; try{ await q(sb.rpc('rechazar_programacion',{p_id:W.id,p_observacion:obs})); toast('Programación devuelta al Director'); W=null; await refresh(); }catch(e){fail(e);} });
  on('#wXls',()=>exportProg(W.id,'xlsx'));
  on('#wHist',()=>showHist(W.id));
}
function confirmLeave(){ return window.confirm ? window.confirm('Hay cambios sin guardar. ¿Salir igual?') : true; }
function parseAmt(s){ s=String(s).trim().replace(/\$|\s/g,''); if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); return parseFloat(s); }
async function wbSave(){
  const items=[...W.items.values()].map(i=>({clave:i.clave,cprov:i.cprov,proveedor:i.proveedor,dependencia:i.dependencia,ff:i.ff,oc:i.oc,expediente:i.expediente,comprobante:i.comprobante,f_factura:i.f_factura,importe:i.importe,monto:i.monto,nota:i.nota||''}));
  const over=items.filter(i=>{ const r=S.factByKey.get(i.clave); return r && i.monto>disponible(r)+0.5; });
  if(over.length){ toast(`${over.length} ${over.length===1?'factura supera':'facturas superan'} el saldo disponible. Revisá los montos marcados.`,true); return null; }
  try{
    const id = await q(sb.rpc('guardar_programacion',{p_id:W.id,p_fecha:W.fecha,p_titulo:W.titulo,p_nota:W.nota,p_items:items}));
    const keepW={mode:W.mode,f:W.f,sort:W.sort};
    await refresh();
    const p=progById(id); openWB(p,keepW.mode); Object.assign(W,{f:keepW.f,sort:keepW.sort}); render();
    return id;
  }catch(e){ fail(e); return null; }
}
async function showHist(id){
  try{
    const ev = await q(sb.from('programacion_eventos').select('*').eq('programacion_id',id).order('at'));
    const ids=[...new Set(ev.map(e=>e.por).filter(Boolean))];
    const ps = ids.length? await q(sb.from('perfiles').select('id,nombre,email,cargo').in('id',ids)) : [];
    const pm=new Map(ps.map(p=>[p.id,p]));
    const m=$('#modal'); m.hidden=false;
    m.innerHTML=`<div class="dlg wide"><div class="eyebrow">Trazabilidad</div><h2>Historial de la programación</h2>
      <div class="tw"><table><thead><tr><th>Fecha</th><th>Acción</th><th>Quién</th><th>Detalle</th></tr></thead><tbody>
      ${ev.map(e=>`<tr><td>${fdt(e.at)}</td><td><span class="st ${({creada:'borrador',guardada:'borrador',enviada:'enviada',aprobada:'aprobada',rechazada:'rechazada',descartada:'descartada',importada:'aprobada'})[e.accion]||'borrador'}">${esc(e.accion)}</span></td>
      <td>${esc(pm.get(e.por)?.nombre||pm.get(e.por)?.email||(e.por?'—':'Sistema'))}<span class="sub">${esc(ROLES[e.rol]||'')}</span></td><td>${esc(e.detalle)}</td></tr>`).join('')}</tbody></table></div>
      <div class="row"><span class="sp"></span><button class="btn" id="hClose">Cerrar</button></div></div>`;
    $('#hClose').onclick=()=>{m.hidden=true;m.innerHTML='';};
  }catch(e){ fail(e); }
}

/* ============ Preselección (Director) ============ */
function progTable(list, mode){
  if(!list.length) return `<div class="empty"><b>No hay programaciones acá</b>${mode==='director'?'Creá una nueva con el botón de arriba.':'Cuando el Director envíe una preselección va a aparecer acá.'}</div>`;
  return `<div class="tw"><table><thead><tr><th>Fecha de pago</th><th>Título</th><th>Estado</th><th class="n">Facturas</th><th class="n">Total</th><th>Actualizada</th><th></th></tr></thead><tbody>
    ${list.map(p=>`<tr><td>${fd(p.fecha_pago)}<span class="sub">Semana ${wom(p.fecha_pago)}</span></td><td>${esc(p.titulo)}${p.observacion&&p.estado==='rechazada'?`<span class="sub" style="color:var(--bad)">${esc(p.observacion)}</span>`:''}</td><td><span class="st ${p.estado}">${ESTADOS[p.estado]}</span></td>
      <td class="n">${(S.itemsByProg.get(p.id)||[]).length}</td><td class="n">${money(progTotal(p.id))}</td><td>${fdt(p.actualizado_at)}</td><td><button class="btn sm" data-p="${p.id}">Abrir</button></td></tr>`).join('')}</tbody></table></div>`;
}
function viewPresel(){
  if(W && W.mode==='director') return viewWB();
  const mine=S.progs.filter(p=>['borrador','rechazada','enviada'].includes(p.estado));
  const done=S.progs.filter(p=>p.estado==='aprobada').slice(0,12);
  main().innerHTML=`<div class="view">
    <div class="head"><div><div class="eyebrow">Director de Pagos</div><h1>Preselección de facturas</h1><p>Armá la programación semanal sobre la base de facturas y enviala a la Subsecretaría de Programación Financiera.</p></div>
      <button class="btn pri" id="newProg" ${!S.carga?'disabled':''}>Nueva programación</button></div>
    ${baseLine()}
    <div class="card"><h3>En curso</h3><p class="cap">Borradores, enviadas y devueltas con observaciones.</p>${progTable(mine,'director')}</div>
    <div class="card"><h3>Últimas aprobadas</h3>${progTable(done,'ver')}</div>
  </div>`;
  $('#newProg').onclick=()=>{ openWB(null,'director'); render(); };
  main().querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const p=progById(+b.dataset.p); openWB(p, ['borrador','rechazada'].includes(p.estado)?'director':'ver'); W.mode = ['borrador','rechazada'].includes(p.estado)?'director':'ver'; viewWB(); });
}
function baseLine(){ return S.carga?`<div class="cap" style="margin:0">Base activa: <b>${esc(S.carga.archivo||'sin nombre')}</b> · saldos al ${fd(S.carga.corte)} · ${nf0.format(S.carga.n)} facturas · ${mm(S.carga.saldo)}. Se descuentan pagos aprobados desde el ${fd(S.carga.descontar_desde)}.</div>`:''; }

/* ============ Aprobación (Subsecretario de Programación Financiera) ============ */
function viewRevision(){
  if(W && W.mode==='subprog') return viewWB();
  if(W && W.mode==='ver') return viewWB();
  const queue=S.progs.filter(p=>p.estado==='enviada');
  const rest=S.progs.filter(p=>['aprobada','rechazada'].includes(p.estado)).slice(0,15);
  main().innerHTML=`<div class="view">
    <div class="head"><div><div class="eyebrow">Subsecretaría de Programación Financiera</div><h1>Aprobación de programaciones</h1><p>Abrí una preselección para revisarla. Podés modificarla antes de aprobar; los cambios quedan registrados en el historial.</p></div></div>
    <div class="card"><h3>Para revisar (${queue.length})</h3>${progTable(queue,'subprog')}</div>
    <div class="card"><h3>Resueltas</h3>${progTable(rest,'ver')}</div>
  </div>`;
  main().querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const p=progById(+b.dataset.p); openWB(p, p.estado==='enviada'?'subprog':'ver'); viewWB(); });
}

/* ============ Cheques diferidos ============ */
let CHF={estado:'vigentes', q:'', desde:'', hasta:''}, CHFORM=null;
function viewCheques(){
  const canEdit=is('director');
  const t=today(), in30=iso(addDays(new Date(),30));
  const vig=S.cheques.filter(c=>['emitido','entregado'].includes(c.estado));
  let list=S.cheques.filter(c=>{
    if(CHF.estado==='vigentes' && !['emitido','entregado'].includes(c.estado)) return false;
    if(CHF.estado!=='vigentes' && CHF.estado!=='todos' && c.estado!==CHF.estado) return false;
    if(CHF.q && !(c.proveedor.toLowerCase().includes(CHF.q.toLowerCase())||c.numero.includes(CHF.q))) return false;
    if(CHF.desde && c.f_vencimiento<CHF.desde) return false; if(CHF.hasta && c.f_vencimiento>CHF.hasta) return false;
    return true;
  });
  const byM=new Map(); for(const c of vig){ const k=monthKey(c.f_vencimiento); byM.set(k,(byM.get(k)||0)+c.monto); }
  main().innerHTML=`<div class="view">
    <div class="head"><div><div class="eyebrow">Fuera de la programación de facturas</div><h1>Cheques diferidos</h1>
      <p>Los cheques se cargan con su vencimiento. No se publican en el feed ni salen en el archivo de facturas a pagar, pero entran en la curva de flujo de caja la semana en que vencen.</p></div>
      ${canEdit?`<div class="row"><button class="btn" id="chOne">Cargar cheque</button><button class="btn pri" id="chSch">Cargar esquema</button></div>`:''}</div>
    <div class="kpis">
      <div class="kpi"><div class="k">Cartera vigente</div><div class="v">${mm(sum(vig,c=>c.monto))}</div><div class="s">${vig.length} cheques emitidos o entregados</div></div>
      <div class="kpi"><div class="k">Vencen en 30 días</div><div class="v">${mm(sum(vig.filter(c=>c.f_vencimiento>=t&&c.f_vencimiento<=in30),c=>c.monto))}</div><div class="s">hasta el ${fd(in30)}</div></div>
      <div class="kpi"><div class="k">Vencidos sin marcar debitados</div><div class="v">${vig.filter(c=>c.f_vencimiento<t).length}</div><div class="s">${mm(sum(vig.filter(c=>c.f_vencimiento<t),c=>c.monto))}</div></div>
      <div class="kpi"><div class="k">Esquemas cargados</div><div class="v">${S.esquemas.length}</div><div class="s">planes de pago en cheques</div></div>
    </div>
    ${CHFORM?chequeForm():''}
    ${byM.size?`<div class="card"><h3>Vencimientos por mes</h3><div class="provlist">${[...byM.entries()].sort().map(([k,v])=>`<div><span>${monthName(k)}</span><span class="num">${money(v)}</span></div>`).join('')}</div></div>`:''}
    <div class="filters">
      <label class="f">Proveedor o número<input type="search" id="cq" value="${esc(CHF.q)}"></label>
      <label class="f">Estado<select id="cest">${[['vigentes','Vigentes'],['todos','Todos'],['emitido','Emitido'],['entregado','Entregado'],['debitado','Debitado'],['anulado','Anulado']].map(([v,t])=>`<option value="${v}" ${CHF.estado===v?'selected':''}>${t}</option>`).join('')}</select></label>
      <label class="f">Vence desde<input type="date" id="cdes" value="${CHF.desde}"></label><label class="f">hasta<input type="date" id="chas" value="${CHF.hasta}"></label>
    </div>
    ${list.length?`<div class="tw tall"><table><thead><tr><th>Vencimiento</th><th>Proveedor</th><th>Número · banco</th><th>Concepto</th><th>Esquema</th><th class="n">Monto</th><th>Estado</th>${canEdit?'<th></th>':''}</tr></thead><tbody>
      ${list.map(c=>{ const venc=c.f_vencimiento<t&&['emitido','entregado'].includes(c.estado); const e=S.esquemas.find(x=>x.id===c.esquema_id); const n=e?S.cheques.filter(x=>x.esquema_id===e.id).sort((a,b)=>a.f_vencimiento.localeCompare(b.f_vencimiento)).findIndex(x=>x.id===c.id)+1:0;
        return `<tr><td>${fd(c.f_vencimiento)}${venc?'<span class="sub" style="color:var(--warn)">vencido</span>':''}<span class="sub">Semana ${wom(c.f_vencimiento)}</span></td><td class="prov">${esc(c.proveedor)}${c.cprov?`<span class="sub">C.Prov ${c.cprov}</span>`:''}</td>
        <td class="num">${esc(c.numero||'—')}<span class="sub">${esc(c.banco||'')}</span></td><td>${esc(c.concepto)}</td><td>${e?`${n} de ${e.cantidad}`:'—'}</td><td class="n">${money(c.monto)}</td>
        <td>${canEdit?`<select data-est="${c.id}">${['emitido','entregado','debitado','anulado'].map(s=>`<option ${c.estado===s?'selected':''}>${s}</option>`).join('')}</select>`:`<span class="pill ${c.estado==='debitado'?'ok':c.estado==='anulado'?'mute':'ink'}">${c.estado}</span>`}</td>
        ${canEdit?`<td><button class="btn sm" data-del="${c.id}">Eliminar</button></td>`:''}</tr>`; }).join('')}</tbody>
      <tfoot><tr><td colspan="5">${list.length} cheques</td><td class="n">${money(sum(list,c=>c.monto))}</td><td colspan="${canEdit?2:1}"></td></tr></tfoot></table></div>`
      :`<div class="empty"><b>No hay cheques con estos filtros</b>${canEdit?'Cargá un cheque suelto o un esquema de cheques con el botón de arriba.':'El Director de Pagos carga los cheques diferidos.'}</div>`}
  </div>`;
  const on=(id,fn)=>{ const b=$(id); if(b) b.onclick=fn; };
  on('#chOne',()=>{ CHFORM={tipo:'uno'}; viewCheques(); });
  on('#chSch',()=>{ CHFORM={tipo:'esq', cant:6, cada:30, prim:iso(addDays(new Date(),30)), total:0, prov:'', concepto:'', banco:'', nro:'', mensual:true}; viewCheques(); });
  $('#cq').oninput=e=>{ CHF.q=e.target.value; clearTimeout(viewCheques._t); viewCheques._t=setTimeout(()=>{ const p=e.target.selectionStart; viewCheques(); const i=$('#cq'); i.focus(); i.setSelectionRange(p,p);},300); };
  $('#cest').onchange=e=>{ CHF.estado=e.target.value; viewCheques(); };
  $('#cdes').onchange=e=>{ CHF.desde=e.target.value; viewCheques(); }; $('#chas').onchange=e=>{ CHF.hasta=e.target.value; viewCheques(); };
  main().querySelectorAll('[data-est]').forEach(s=>s.onchange=async()=>{ try{ await q(sb.from('cheques').update({estado:s.value}).eq('id',+s.dataset.est)); toast('Estado actualizado'); await refresh(); }catch(e){fail(e);} });
  main().querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='¿Confirmar?'; b.classList.add('bad'); return; } try{ await q(sb.from('cheques').delete().eq('id',+b.dataset.del)); toast('Cheque eliminado'); await refresh(); }catch(e){fail(e);} });
  if(CHFORM) bindChequeForm();
}
function provOptions(){ const m=new Map(); for(const r of S.fact) if(!m.has(r.cprov)) m.set(r.cprov,r.proveedor); return `<datalist id="provs">${[...m.entries()].sort((a,b)=>a[1].localeCompare(b[1],'es')).map(([c,n])=>`<option value="${esc(n)} · ${c}">`).join('')}</datalist>`; }
function parseProv(s){ const m=String(s).match(/^(.*) · (\d+)$/); return m?{proveedor:m[1].trim(),cprov:+m[2]}:{proveedor:String(s).trim(),cprov:null}; }
function schedule(F){
  const n=Math.max(1,Math.min(60,+F.cant||1)), tot=Math.round((+F.total||0)*100), base=Math.floor(tot/n);
  const out=[]; const d0=pd(F.prim);
  for(let i=0;i<n;i++){ let d; if(F.mensual){ d=new Date(d0.getFullYear(),d0.getMonth()+i,1); d.setDate(Math.min(d0.getDate(), new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); } else d=addDays(d0,i*(+F.cada||30));
    out.push({f_vencimiento:iso(d), monto:(i===n-1? tot-base*(n-1) : base)/100, numero: F.nro && /^\d+$/.test(F.nro) ? String(+F.nro+i).padStart(F.nro.length,'0') : ''}); }
  return out;
}
function chequeForm(){
  const F=CHFORM;
  if(F.tipo==='uno') return `<form class="card" id="chf"><h3>Cargar cheque</h3>${provOptions()}
    <div class="row" style="align-items:flex-end">
      <label class="f" style="flex:2 1 260px">Proveedor<input type="text" id="cfp" list="provs" required placeholder="Buscá en la base o escribí el nombre"></label>
      <label class="f">Número<input type="text" id="cfn"></label><label class="f">Banco<input type="text" id="cfb"></label>
      <label class="f">Monto<input type="text" id="cfm" class="amt" required></label>
      <label class="f">Emisión<input type="date" id="cfe" value="${today()}"></label><label class="f">Vencimiento<input type="date" id="cfv" required></label>
      <label class="f" style="flex:2 1 220px">Concepto<input type="text" id="cfc"></label></div>
    <div class="row" style="margin-top:10px"><button class="btn pri" type="submit">Guardar cheque</button><button class="btn" type="button" id="cfx">Cancelar</button></div></form>`;
  const sch=schedule(F);
  return `<form class="card" id="chf"><h3>Cargar esquema de cheques</h3><p class="cap">Un plan de pago a un proveedor en varios cheques. Se reparte el monto total en partes iguales; el último absorbe el redondeo. Podés corregir fechas y montos antes de guardar.</p>${provOptions()}
    <div class="row" style="align-items:flex-end">
      <label class="f" style="flex:2 1 260px">Proveedor<input type="text" id="cfp" list="provs" required value="${esc(F.prov)}"></label>
      <label class="f">Monto total<input type="text" id="cft" class="amt" required value="${F.total?nf2.format(F.total):''}"></label>
      <label class="f">Cantidad<input type="number" id="cfq" min="1" max="60" value="${F.cant}" style="width:80px"></label>
      <label class="f">Primer vencimiento<input type="date" id="cf1" value="${F.prim}"></label>
      <label class="f">Periodicidad<select id="cfper"><option value="m" ${F.mensual?'selected':''}>Mensual (mismo día)</option><option value="d" ${!F.mensual?'selected':''}>Cada N días</option></select></label>
      ${!F.mensual?`<label class="f">Días<input type="number" id="cfd" min="1" value="${F.cada}" style="width:80px"></label>`:''}
      <label class="f">Banco<input type="text" id="cfb" value="${esc(F.banco)}"></label>
      <label class="f">Nº del primer cheque<input type="text" id="cfn" value="${esc(F.nro)}" placeholder="Correlativos"></label>
      <label class="f" style="flex:2 1 220px">Concepto<input type="text" id="cfc" value="${esc(F.concepto)}" placeholder="Ej.: OC 1398, saldo 2025"></label></div>
    ${F.total>0?`<div class="tw" style="margin-top:12px"><table><thead><tr><th>#</th><th>Vencimiento</th><th>Número</th><th class="n">Monto</th></tr></thead><tbody>
      ${(F.rows||sch).map((c,i)=>`<tr><td>${i+1}</td><td><input type="date" data-sv="${i}" value="${c.f_vencimiento}"></td><td><input type="text" data-sn="${i}" value="${esc(c.numero)}"></td><td class="n"><input class="amt" data-sm="${i}" value="${nf2.format(c.monto)}"></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="n">${money(sum(F.rows||sch,c=>c.monto))}</td></tr></tfoot></table></div>`:''}
    <div class="row" style="margin-top:10px"><button class="btn pri" type="submit" ${F.total>0?'':'disabled'}>Guardar esquema</button><button class="btn" type="button" id="cfx">Cancelar</button></div></form>`;
}
function bindChequeForm(){
  const F=CHFORM; $('#cfx').onclick=()=>{ CHFORM=null; viewCheques(); };
  if(F.tipo==='esq'){
    const re=()=>{ F.rows=null; setTimeout(viewCheques,0); };
    const bindv=(id,k,fn=v=>v)=>{ const e=$(id); if(e) e.onchange=()=>{ F[k]=fn(e.target? e.value : e.value); re(); }; };
    bindv('#cfp','prov'); bindv('#cft','total',parseAmt); bindv('#cfq','cant',Number); bindv('#cf1','prim'); bindv('#cfd','cada',Number); bindv('#cfb','banco'); bindv('#cfn','nro'); bindv('#cfc','concepto');
    $('#cfper').onchange=e=>{ F.mensual=e.target.value==='m'; re(); };
    const rows=()=>F.rows||(F.rows=schedule(F));
    main().querySelectorAll('[data-sv]').forEach(i=>i.onchange=()=>{ rows()[+i.dataset.sv].f_vencimiento=i.value; });
    main().querySelectorAll('[data-sn]').forEach(i=>i.onchange=()=>{ rows()[+i.dataset.sn].numero=i.value; });
    main().querySelectorAll('[data-sm]').forEach(i=>i.onchange=()=>{ rows()[+i.dataset.sm].monto=parseAmt(i.value)||0; setTimeout(viewCheques,0); });
  }
  $('#chf').onsubmit=async ev=>{
    ev.preventDefault();
    try{
      if(F.tipo==='uno'){
        const p=parseProv($('#cfp').value), monto=parseAmt($('#cfm').value);
        if(!(monto>0)) throw new Error('Ingresá un monto válido.');
        await q(sb.from('cheques').insert({...p, numero:$('#cfn').value.trim(), banco:$('#cfb').value.trim(), monto, f_emision:$('#cfe').value||null, f_vencimiento:$('#cfv').value, concepto:$('#cfc').value.trim()}));
        toast('Cheque cargado');
      } else {
        const p=parseProv(F.prov), rows=F.rows||schedule(F);
        if(!p.proveedor) throw new Error('Elegí el proveedor.');
        if(rows.some(r=>!(r.monto>0)||!r.f_vencimiento)) throw new Error('Revisá montos y fechas de los cheques.');
        const esq = await q(sb.from('cheque_esquemas').insert({...p, concepto:F.concepto, monto_total:sum(rows,r=>r.monto), cantidad:rows.length, primer_vto:rows[0].f_vencimiento, cada_dias:F.mensual?30:+F.cada}).select().single());
        await q(sb.from('cheques').insert(rows.map(r=>({...p, esquema_id:esq.id, numero:r.numero, banco:F.banco, concepto:F.concepto, monto:r.monto, f_emision:today(), f_vencimiento:r.f_vencimiento}))));
        toast(`Esquema cargado: ${rows.length} cheques`);
      }
      CHFORM=null; await refresh();
    }catch(e){ fail(e); }
  };
}

/* ============ Base de facturas ============ */
let BF={q:'',dep:'',ff:'',edad:'',lim:200}, UP=null;
function viewBase(){
  const canUp=is('director','subprog');
  const pend=S.fact.filter(r=>r.pendiente>0);
  const venc=pend.filter(r=>r.dias>60);
  const byP=new Map(); for(const r of pend){ const k=r.cprov; if(!byP.has(k)) byP.set(k,{n:r.proveedor,t:0,c:0}); byP.get(k).t+=r.pendiente; byP.get(k).c++; }
  const top=[...byP.values()].sort((a,b)=>b.t-a.t).slice(0,12);
  const ql=BF.q.toLowerCase();
  const rows=S.fact.filter(r=>(!ql||r.proveedor.toLowerCase().includes(ql)||r.comprobante.includes(ql)||String(r.cprov)===ql)&&(!BF.dep||r.dependencia===BF.dep)&&(!BF.ff||String(r.ff)===BF.ff)&&(!BF.edad||r.dias>=+BF.edad));
  const deps=[...new Set(S.fact.map(r=>r.dependencia).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  main().innerHTML=`<div class="view">
    <div class="head"><div><div class="eyebrow">Facturas a pagar</div><h1>Base de facturas</h1><p>La base se reemplaza con cada listado general que se carga. El pendiente descuenta los pagos aprobados en el portal desde la fecha indicada en la carga.</p></div>
      ${canUp?`<label class="btn pri" style="display:inline-block">Cargar listado (Excel o CSV)<input type="file" id="upf" accept=".xlsx,.xls,.csv" hidden></label>`:''}</div>
    ${UP?uploadPanel():''}
    ${S.carga?`<div class="kpis">
      <div class="kpi"><div class="k">Saldo en la base</div><div class="v">${mm(S.carga.saldo)}</div><div class="s">${nf0.format(S.carga.n)} facturas al ${fd(S.carga.corte)}</div></div>
      <div class="kpi"><div class="k">Pendiente neto</div><div class="v">${mm(sum(pend,r=>r.pendiente))}</div><div class="s">${nf0.format(pend.length)} facturas con saldo</div></div>
      <div class="kpi"><div class="k">Más de 60 días</div><div class="v">${mm(sum(venc,r=>r.pendiente))}</div><div class="s">${nf0.format(venc.length)} facturas · ${Math.round(sum(venc,r=>r.pendiente)/Math.max(1,sum(pend,r=>r.pendiente))*100)}% del pendiente</div></div>
      <div class="kpi"><div class="k">En programaciones en curso</div><div class="v">${mm(sum(S.fact,r=>r.en_curso))}</div><div class="s">borradores y enviadas</div></div>
      <div class="kpi"><div class="k">Proveedores con saldo</div><div class="v">${byP.size}</div><div class="s">${deps.length} dependencias</div></div>
    </div>
    <div class="grid">
      <div class="card s4"><h3>Mayor deuda pendiente</h3><p class="cap">Por proveedor, neto de pagos aprobados.</p>${top.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.n)} <span class="cap">(${x.c})</span></span><span class="num">${mm(x.t)}</span></div><div class="bar"><i style="width:${Math.round(x.t/top[0].t*100)}%"></i></div>`).join('')}</div>
      <div class="card s8"><h3>Antigüedad del pendiente</h3><p class="cap">Días desde la fecha de factura.</p><div class="chart sm"><canvas id="chAge"></canvas></div></div>
    </div>
    <div class="filters">
      <label class="f">Buscar<input type="search" id="bq" value="${esc(BF.q)}"></label>
      <label class="f">Dependencia<select id="bdep"><option value="">Todas</option>${deps.map(d=>`<option ${BF.dep===d?'selected':''}>${esc(d)}</option>`).join('')}</select></label>
      <label class="f">FF<select id="bff"><option value="">Todas</option>${[...new Set(S.fact.map(r=>r.ff))].sort().map(x=>`<option ${BF.ff===String(x)?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="f">Antigüedad<select id="bedad"><option value="">Todas</option>${[30,60,90,180].map(n=>`<option value="${n}" ${BF.edad==n?'selected':''}>${n}+ días</option>`).join('')}</select></label>

function normH(s){ return String(s??'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z]/g,''); }
const HMAP={EJ:'ej',CPROV:'cprov',PROVEEDOR:'proveedor',DEPDESC:'dependencia',DEPENDENCIA:'dependencia',JUR:'jur',FF:'ff',FFIN:'ff',OCNRO:'oc',OC:'oc',EXPED:'expediente',EXPEDIENTE:'expediente',COMPROBANTE:'comprobante',FFACTURA:'f_factura',FVENC:'f_venc',IMPORTE:'importe',PAGADO:'pagado',SALDO:'saldo',VAL:'validada',VALIDADA:'validada'};
function cellDate(v, X){
  if(v==null||v==='') return null;
  if(v instanceof Date) return iso(new Date(v.getTime()+ (v.getTimezoneOffset()>0?0:0) + 12*3600e3));
  if(typeof v==='number'){ const d=X.SSF.parse_date_code(v); return d? `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:null; }
  const m=String(v).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  const m2=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m2?m2[0]:null;
}
function cellNum(v){ if(v==null||v==='') return null; if(typeof v==='number') return v; return parseAmt(v); }
async function parseUpload(file){
  try{
    toast('Leyendo '+file.name+'…');
    const X=await loadXlsx();
    const buf=await file.arrayBuffer();
    const wb=X.read(buf,{type:'array',cellDates:true});
    const names=wb.SheetNames.includes('GENERAL')?['GENERAL',...wb.SheetNames.filter(n=>n!=='GENERAL')]:wb.SheetNames;
    let found=null;
    for(const n of names){ const aoa=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}); const hi=aoa.findIndex(r=>r&&r.some(c=>normH(c)==='PROVEEDOR')&&r.some(c=>normH(c)==='COMPROBANTE')); if(hi>=0){ found={n,aoa,hi}; break; } }
    if(!found) throw new Error('No encontré una hoja con columnas PROVEEDOR y COMPROBANTE.');
    const head=found.aoa[found.hi].map(c=>HMAP[normH(c)]||null);
    for(const need of ['cprov','proveedor','comprobante','f_factura','importe']) if(!head.includes(need)) throw new Error('Falta la columna '+need.toUpperCase()+' en la hoja '+found.n+'.');
    const rows=[]; let skip=0;
    for(const r of found.aoa.slice(found.hi+1)){
      if(!r) continue; const o={}; head.forEach((k,i)=>{ if(k) o[k]=r[i]; });
      const cprov=cellNum(o.cprov), comp=String(o.comprobante??'').trim();
      if(!cprov||!comp){ skip++; continue; }
      const val=String(o.validada??'').trim().toUpperCase();
      rows.push({ej:cellNum(o.ej),cprov:Math.round(cprov),proveedor:String(o.proveedor??'').replace(/\s+/g,' ').trim(),dependencia:String(o.dependencia??'').replace(/\s+/g,' ').trim(),jur:cellNum(o.jur),ff:cellNum(o.ff),oc:cellNum(o.oc),expediente:cellNum(o.expediente),
        comprobante:comp,f_factura:cellDate(o.f_factura,X),f_venc:cellDate(o.f_venc,X),importe:cellNum(o.importe)||0,pagado:cellNum(o.pagado)||0,saldo:o.saldo==null?null:cellNum(o.saldo),validada:val==='SI'?true:val==='NO'?false:null});
    }
    const keys=new Set(rows.map(r=>r.cprov+'|'+r.comprobante));
    const old=new Map(S.fact.map(r=>[r.clave,r]));
    const nuevas=rows.filter(r=>!old.has(r.cprov+'|'+r.comprobante));
    const salen=S.fact.filter(r=>!keys.has(r.clave));
    const cambian=rows.filter(r=>{ const o=old.get(r.cprov+'|'+r.comprobante); return o && Math.abs((r.saldo??r.importe-r.pagado)-o.saldo)>0.5; });
    const m=file.name.match(/(\d{1,2})[-_.](\d{1,2})(?:[-_.](\d{2,4}))?/);
    let corte=today(); if(m){ const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):new Date().getFullYear(); corte=`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
    UP={file:file.name, sheet:found.n, rows, skip, nuevas, salen, cambian, corte, desde:iso(addDays(pd(corte),-7))};
    viewBase();
  }catch(e){ fail(e); }
}
